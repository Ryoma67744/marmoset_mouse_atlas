name: Verify normalization and exports

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload synthetic 3D preview
        uses: actions/upload-artifact@v4
        with:
          name: stack3d-preview
          path: test-artifacts/stack3d-brain-preview.png
          if-no-files-found: ignore
          retention-days: 3
