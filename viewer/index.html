            const verts = drawingVertices.slice();
            if (verts.length < 3) { toggleDrawingMode(false); return; }
            const name = (prompt('新しい ROI の名前を入力してください', `User ROI ${nextUserRoiNumber()}`) || '').trim();
            if (!name) { toggleDrawingMode(false); return; }
            const newKey = `${USER_ROI_PREFIX}${Date.now()}`;
            const rgba = pickUnusedPaletteColor();
            atlasData.roi = atlasData.roi || {};
            atlasData.roi.roi_items = atlasData.roi.roi_items || {};
            atlasData.roi.roi_names = atlasData.roi.roi_names || {};
            atlasData.roi.palette   = atlasData.roi.palette   || {};
            atlasData.roi.roi_show_flags = atlasData.roi.roi_show_flags || {};
            atlasData.roi.roi_items[newKey] = [{ poly_msi: verts }];
            atlasData.roi.roi_names[newKey] = name;
            atlasData.roi.palette[newKey]   = rgba;
            atlasData.roi.roi_show_flags[newKey] = true;
            toggleDrawingMode(false);
            persistRoi();
            populateRoiList();
            // 新規作成した ROI を active 扱いにしてリストのハイライトも合わせる
            const newItem = document.querySelector(`.roi-item[data-roi-key="${CSS.escape(newKey)}"]`);
            if (newItem) {
                document.querySelectorAll('.roi-item').forEach(i => i.classList.remove('active'));
                newItem.classList.add('active');
            }
            drawAllRois(newKey);
            displayGraphForRoi(newKey);
        }

        function deleteUserRoi(key) {
            if (!key || !key.startsWith(USER_ROI_PREFIX)) return;
            if (!confirm('この ROI を削除しますか?')) return;
            const wasActive = document.querySelector(`.roi-item.active[data-roi-key="${CSS.escape(key)}"]`) !== null;
            if (atlasData.roi) {
                delete atlasData.roi.roi_items[key];
                delete atlasData.roi.roi_names[key];
                delete atlasData.roi.palette[key];
                if (atlasData.roi.roi_show_flags) delete atlasData.roi.roi_show_flags[key];
            }
            persistRoi();
            populateRoiList();
            // 削除した ROI が active なら残った先頭 ROI に切替、そうでなければ現在の active を維持
            const remaining = Object.keys((atlasData.roi && atlasData.roi.roi_items) || {});
            let nextKey = null;
            if (wasActive && remaining.length > 0) {
                nextKey = remaining[0];
                const nextItem = document.querySelector(`.roi-item[data-roi-key="${CSS.escape(nextKey)}"]`);
                if (nextItem) nextItem.classList.add('active');
            } else {
                nextKey = document.querySelector('.roi-item.active')?.dataset.roiKey || null;
            }
            drawAllRois(nextKey);
            displayGraphForRoi(nextKey);
        }

        function setupDrawingHandlers() {
            const btn = document.getElementById('roi-draw-toggle');
            if (btn) btn.addEventListener('click', () => toggleDrawingMode());

            roiCanvas.addEventListener('click', (e) => {
                if (!drawingMode) return;
                const sxCss = roiCanvas.width  / (roiCanvas.offsetWidth || 1);
                const syCss = roiCanvas.height / (roiCanvas.offsetHeight || 1);
                const canvasX = e.offsetX * sxCss;
                const canvasY = e.offsetY * syCss;
                // 最初の頂点を再クリックしたら閉じる(近接判定)
                if (drawingVertices.length >= 3) {
                    const msiRef = getMsiRefSize();
                    const sxFactor = roiCanvas.height / msiRef.w;
                    const syFactor = roiCanvas.width  / msiRef.h;
                    const [mx0, my0] = drawingVertices[0];
                    const cx0 = my0 * syFactor;
                    const cy0 = roiCanvas.height - mx0 * sxFactor;
                    const dx = canvasX - cx0, dy = canvasY - cy0;
                    const threshold = 8 * sxCss;
                    if (Math.sqrt(dx*dx + dy*dy) < threshold) { finalizeDrawing(); return; }
                }
                const [mx, my] = canvasToMsi(canvasX, canvasY);
                drawingVertices.push([mx, my]);
                drawDrawingPreview();
            });

            roiCanvas.addEventListener('dblclick', (e) => {
                if (!drawingMode) return;
                e.preventDefault();
                finalizeDrawing();
            });

            document.addEventListener('keydown', (e) => {
                if (!drawingMode) return;
                if (e.key === 'Escape') { toggleDrawingMode(false); }
                else if (e.key === 'Enter') { finalizeDrawing(); }
            });
        }

        // =======================================================================
        // ZIP 書き出し / 読み込み
        // =======================================================================

        // 表示中の状態を「保存可能なプロジェクト」に落とす。
        // 静的データセット (?atlas=) を開いている場合も、生値ラスタは持っているので
        // 同じ形にまとめて Export できる。
        async function buildExportableProject() {
            if (currentProject) {
                syncProjectFromViewer();
                return currentProject;
            }
            const ref = getMsiRefSize();
            const wc = atlasData.world_coords || {};
            const proj = {
                id: ProjectStorage.uid('proj'),
                displayName: (atlasData.meta && atlasData.meta.dataset_id) || 'atlas',
                source: 'atlas',
                orientation: '', plane: '', sliceId: '',
                grid: {
                    W: ref.w, H: ref.h,
                    umPerPxX: (wc.msi_um_per_px && wc.msi_um_per_px.x) || null,
                    umPerPxY: (wc.msi_um_per_px && wc.msi_um_per_px.y) || null,
                },
                molecules: [], images: {},
                world_coords: wc,
                alignment: atlasData.alignment || {},
                layerDisplay: {},
                otsu: { applied: otsuState.applied, strength: otsuState.strength, manualThreshold: otsuState.manualThreshold },
                visibleLayers: checkedLayerKeys(),
                viewerTransform: Object.assign({}, viewTransform),
                roi: atlasData.roi || {},
            };
            // 生値ラスタを一時 blob に落として ZipIO に渡す
            for (const key of Object.keys(valueRasters)) {
                const vr = valueRasters[key];
                const blobId = await ProjectStorage.putValueRaster(vr.values);
                proj.molecules.push({
                    key: key, name: key.replace(/^MSI_/i, ''), blobId: blobId,
                    filterString: '', mode: '', nSpectra: 0,
                    stats: vr.stats || MSIRaster.deriveBakeStats(vr.values),
                });
            }
            for (const key of Object.keys(imageSettings)) {
                const s = imageSettings[key];
                proj.layerDisplay[key] = { vmin: s.vmin, vmax: s.vmax, opacity: s.opacity, applyOpacity: s.applyOpacity !== false };
            }
            // HE/IF は data URL しか手元に無いので blob に戻して同梱する
            for (const key of Object.keys(atlasData.images || {})) {
                if (!/HE_STAIN|IF_STAIN/i.test(key)) continue;
                const src = atlasData.images[key];
                if (typeof src !== 'string') continue;
                try {
                    const blob = await (await fetch(src)).blob();
                    const blobId = await ProjectStorage.putBlob({ blob: blob, mime: blob.type || 'image/png', filename: key + '.png' });
                    proj.images[key] = { blobId: blobId, mime: blob.type || 'image/png', filename: key + '.png' };
                } catch (e) { console.warn('[export] 画像の取り出しに失敗', key, e); }
            }
            proj._temporary = true;
            return proj;
        }

        // ビューア側の現在値をプロジェクトに書き戻す
        function syncProjectFromViewer() {
            if (!currentProject) return;
            currentProject.visibleLayers = checkedLayerKeys();
            currentProject.viewerTransform = Object.assign({}, viewTransform);
            currentProject.otsu = {
                applied: otsuState.applied,
                strength: otsuState.strength,
                manualThreshold: otsuState.manualThreshold,
            };
            currentProject.roi = atlasData.roi || currentProject.roi;
            currentProject.world_coords = atlasData.world_coords || currentProject.world_coords;
            currentProject.layerDisplay = currentProject.layerDisplay || {};
            for (const key of Object.keys(imageSettings)) {
                const s = imageSettings[key];
                currentProject.layerDisplay[key] = {
                    vmin: s.vmin, vmax: s.vmax, opacity: s.opacity, applyOpacity: s.applyOpacity !== false,
                };
            }
        }

        async function exportZip() {
            const btn = document.getElementById('export-zip');
            const original = btn ? btn.textContent : '';
            try {
                if (btn) { btn.disabled = true; btn.textContent = '準備中…'; }
                const proj = await buildExportableProject();
                const blob = await ZipIO.exportProject(proj);
                const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = ZipIO.safeName(proj.displayName) + '_' + ts + '.zip';
                document.body.appendChild(a); a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                // 一時プロジェクトが作った blob は後始末する
                if (proj._temporary) {
                    for (const id of ProjectStorage.collectBlobIds(proj)) {
                        ProjectStorage.deleteBlob(id).catch(() => {});
                    }
                }
                if (currentProject) await ProjectStorage.putProject(currentProject);
            } catch (e) {
                console.error('[exportZip]', e);
                alert('Export に失敗しました: ' + e.message);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = original; }
            }
        }

        async function importZip(file) {
            const btn = document.getElementById('import-zip');
            const original = btn ? btn.textContent : '';
            try {
                if (btn) { btn.disabled = true; btn.textContent = '読み込み中…'; }
                const { project, warnings } = await ZipIO.importZip(file);
                if (warnings.length) console.warn('[importZip] 警告:', warnings);
                // 読み込んだプロジェクトをそのまま開く
                location.href = 'index.html?project=' + encodeURIComponent(project.id);
            } catch (e) {
                console.error('[importZip]', e);
                alert('ZIP の読み込みに失敗しました: ' + e.message);
                if (btn) { btn.disabled = false; btn.textContent = original; }
            }
        }

        function setupZipButtons() {
            const ex = document.getElementById('export-zip');
            if (ex) ex.addEventListener('click', exportZip);
            const imBtn = document.getElementById('import-zip');
            const imInput = document.getElementById('import-zip-input');
            if (imBtn && imInput) {
                imBtn.addEventListener('click', () => imInput.click());
                imInput.addEventListener('change', () => {
                    const f = imInput.files && imInput.files[0];
                    imInput.value = '';
                    if (f) importZip(f);
                });
            }
        }

        // =======================================================================
        // パン / ズーム
        //
        // #image-viewer-rot の CSS transform に --vt-* を載せるだけ。
        // canvas 要素そのものが変換されるので、ROI 描画が使う event.offsetX/offsetY は
        // 変換前のローカル座標で届き、canvasToMsi() 以下は無改造で動く。
        // =======================================================================
        function applyViewTransform() {
            const rot = document.getElementById('image-viewer-rot');
            if (rot) {
                rot.style.setProperty('--vt-tx', viewTransform.tx + 'px');
                rot.style.setProperty('--vt-ty', viewTransform.ty + 'px');
                rot.style.setProperty('--vt-scale', String(viewTransform.scale));
            }
            const out = document.getElementById('zoom-readout');
            if (out) out.textContent = Math.round(viewTransform.scale * 100) + '%';
        }

        function setupViewTransform() {
            const host = document.getElementById('image-viewer');
            if (!host || host.dataset.transformWired === '1') return;
            host.dataset.transformWired = '1';
            host.classList.add('pannable');

            const ptrs = new Map();
            let dragging = false;
            let startX = 0, startY = 0, baseTx = 0, baseTy = 0;
            let pinch = null;

            const beginPan = (px, py) => {
                dragging = true;
                startX = px; startY = py;
                baseTx = viewTransform.tx; baseTy = viewTransform.ty;
            };

            host.addEventListener('pointerdown', (ev) => {
                if (ev.button !== 0 && ev.pointerType === 'mouse') return;
                if (drawingMode) return;   // ROI 描画中はパンさせない
                ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
                try { host.setPointerCapture(ev.pointerId); } catch (e) {}
                if (ptrs.size === 1) { beginPan(ev.clientX, ev.clientY); host.classList.add('panning'); }
                else if (ptrs.size === 2) {
                    dragging = false;
                    const p = [...ptrs.values()];
                    pinch = { d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, s0: viewTransform.scale };
                }
            });

            host.addEventListener('pointermove', (ev) => {
                const p = ptrs.get(ev.pointerId);
                if (!p) return;
                p.x = ev.clientX; p.y = ev.clientY;
                if (pinch && ptrs.size >= 2) {
                    const v = [...ptrs.values()];
                    const dist = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
                    const sNew = clampScale(pinch.s0 * (dist / pinch.d0));
                    // 指の中点をズームの不動点にする。translate は画面座標なので
                    // 等方スケールなら回転は打ち消し合う。
                    const r = host.getBoundingClientRect();
                    const Mx = (v[0].x + v[1].x) / 2 - (r.left + r.width / 2);
                    const My = (v[0].y + v[1].y) / 2 - (r.top + r.height / 2);
                    zoomAbout(sNew, Mx, My);
                } else if (dragging) {
                    viewTransform.tx = baseTx + (ev.clientX - startX);
                    viewTransform.ty = baseTy + (ev.clientY - startY);
                    applyViewTransform();
                }
            });

            const endPointer = (ev) => {
                ptrs.delete(ev.pointerId);
                try { host.releasePointerCapture(ev.pointerId); } catch (e) {}
                if (ptrs.size < 2) pinch = null;
                if (ptrs.size === 1) {
                    // 2 本指 → 1 本指に戻ったとき、掴み直して飛びを防ぐ
                    const p = [...ptrs.values()][0];
                    beginPan(p.x, p.y);
                } else if (ptrs.size === 0) {
                    dragging = false;
                    host.classList.remove('panning');
                    persistViewTransform();
                }
            };
            host.addEventListener('pointerup', endPointer);
            host.addEventListener('pointercancel', endPointer);

            host.addEventListener('wheel', (ev) => {
                if (drawingMode) return;
                ev.preventDefault();
                const r = host.getBoundingClientRect();
                // カーソル位置を不動点にする (Share_Test はホイールでは中心固定だが、
                // 拡大して細部を見る用途ではカーソル基準のほうが操作しやすい)
                const Mx = ev.clientX - (r.left + r.width / 2);
                const My = ev.clientY - (r.top + r.height / 2);
                zoomAbout(clampScale(viewTransform.scale * Math.exp(-ev.deltaY * 0.001)), Mx, My);
                persistViewTransform();
            }, { passive: false });

            const resetBtn = document.getElementById('view-reset');
            if (resetBtn) resetBtn.addEventListener('click', () => {
                viewTransform.tx = 0; viewTransform.ty = 0; viewTransform.scale = 1;
                applyViewTransform();
                persistViewTransform();
            });

            applyViewTransform();
        }

        function clampScale(s) { return Math.max(0.2, Math.min(8, s)); }

        function zoomAbout(sNew, Mx, My) {
            const k = sNew / viewTransform.scale;
            viewTransform.tx = Mx - k * (Mx - viewTransform.tx);
            viewTransform.ty = My - k * (My - viewTransform.ty);
            viewTransform.scale = sNew;
            applyViewTransform();
        }

        function persistViewTransform() {
            if (!currentProject) return;
            currentProject.viewerTransform = Object.assign({}, viewTransform);
            queueSaveProject();
        }

        // =======================================================================
        // 大津法 (背景除去)
        // =======================================================================
        function recomputeOtsu() {
            const keys = Object.keys(valueRasters);
            if (!keys.length) { otsuState.record = null; return; }
            const tic = Otsu.buildTic(keys.map(k => valueRasters[k]));
            const ref = valueRasters[keys[0]];
            otsuState.record = Otsu.buildOtsuRecord(tic, ref.W, ref.H, {
                strength: otsuState.strength,
                manualThreshold: otsuState.manualThreshold,
            });
        }

        function refreshOtsuUi() {
            const panel = document.getElementById('otsu-panel');
            const readout = document.getElementById('otsu-readout');
            if (!panel) return;
            panel.classList.toggle('hidden', !otsuState.applied);
            if (!otsuState.applied || !otsuState.record) return;
            const rec = otsuState.record;
            const pct = rec.nOriginal ? (100 * rec.nRemoved / rec.nOriginal) : 0;
            if (readout) {
                readout.textContent = `閾値 ${Number(rec.thresholdOriginal.toPrecision(4))} / 除去 ${pct.toFixed(1)}%`;
            }
            drawOtsuHistogram();
        }

        function drawOtsuHistogram() {
            const canvas = document.getElementById('otsu-hist');
            const rec = otsuState.record;
            if (!canvas || !rec) return;
            const cssW = canvas.clientWidth || 600;
            canvas.width = cssW; canvas.height = 90;
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const counts = rec.histCounts;
            let maxC = 0;
            for (const c of counts) if (c > maxC) maxC = c;
            const logMax = Math.log10(maxC + 1) || 1;
            const bw = W / counts.length;
            const span = (rec.histMax - rec.histMin) || 1;
            const xOf = (logv) => (logv - rec.histMin) / span * W;

            for (let i = 0; i < counts.length; i++) {
                const center = rec.histMin + (i + 0.5) * span / counts.length;
                const hgt = Math.log10(counts[i] + 1) / logMax * (H - 12);
                ctx.fillStyle = center <= rec.effLog ? '#cbd5e1' : '#60a5fa';
                ctx.fillRect(i * bw, H - hgt, Math.max(1, bw), hgt);
            }
            // 自動 Otsu = グレー破線、有効閾値 = 赤の実線
            ctx.strokeStyle = '#9ca3af'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(xOf(rec.autoThresholdLog), 0); ctx.lineTo(xOf(rec.autoThresholdLog), H); ctx.stroke();
            ctx.setLineDash([]);
            ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(xOf(rec.effLog), 0); ctx.lineTo(xOf(rec.effLog), H); ctx.stroke();

            ctx.fillStyle = '#94a3b8'; ctx.font = '9px sans-serif';
            ctx.fillText('除去', 4, 10);
            ctx.fillText('組織', W - 24, 10);
        }

        function applyOtsuAndRedraw() {
            recomputeOtsu();
            refreshOtsuUi();
            renderCompositeImage();
            for (const [key, el] of msiThumbRefs) renderMsiThumbnail(key, el);
            const activeRoi = document.querySelector('.roi-item.active');
            if (activeRoi) displayGraphForRoi(activeRoi.dataset.roiKey);
            if (currentProject) {
                currentProject.otsu = {
                    applied: otsuState.applied, strength: otsuState.strength,
                    manualThreshold: otsuState.manualThreshold,
                };
                queueSaveProject();
            }
        }

        function setupOtsuUi() {
            const toggle = document.getElementById('otsu-toggle');
            const canvas = document.getElementById('otsu-hist');
            const resetBtn = document.getElementById('otsu-reset');
            if (!toggle) return;

            // 生値ラスタが無い (= 8bit 画像しかない) 場合は使えない
            const usable = Object.keys(valueRasters).length > 0;
            toggle.disabled = !usable;
            if (!usable) {
                toggle.parentElement.title = 'このデータセットには生値ラスタが無いため背景除去は使えません';
                return;
            }

            toggle.checked = otsuState.applied;
            if (otsuState.applied) recomputeOtsu();
            refreshOtsuUi();

            toggle.addEventListener('change', () => {
                otsuState.applied = toggle.checked;
                applyOtsuAndRedraw();
            });

            if (resetBtn) resetBtn.addEventListener('click', () => {
                otsuState.strength = 0;
                otsuState.manualThreshold = null;
                applyOtsuAndRedraw();
            });

            if (canvas) {
                let dragging = false;
                const toLog = (ev) => {
                    const rec = otsuState.record;
                    if (!rec) return null;
                    const r = canvas.getBoundingClientRect();
                    const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / Math.max(1, r.width)));
                    return rec.histMin + f * (rec.histMax - rec.histMin);
                };
                const setFrom = (ev) => {
                    const rec = otsuState.record;
                    const lv = toLog(ev);
                    if (!rec || lv == null) return;
                    // 強度 = 自動 Otsu からの log10 オフセット。[-3, +3] に丸める。
                    otsuState.strength = Math.max(-3, Math.min(3, lv - rec.autoThresholdLog));
                    otsuState.manualThreshold = null;
                };
                canvas.addEventListener('pointerdown', (ev) => {
                    dragging = true;
                    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
                    setFrom(ev); recomputeOtsu(); refreshOtsuUi();
                });
                canvas.addEventListener('pointermove', (ev) => {
                    if (!dragging) return;
                    setFrom(ev); recomputeOtsu(); refreshOtsuUi();
                });
                const end = (ev) => {
                    if (!dragging) return;
                    dragging = false;
                    try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
                    applyOtsuAndRedraw();
                };
                canvas.addEventListener('pointerup', end);
                canvas.addEventListener('pointercancel', end);
            }

            window.addEventListener('resize', () => { if (otsuState.applied) drawOtsuHistogram(); });
        }
    </script>

    <script>
    // =====================================================================
    // 重ね合わせ (HE ↔ MSI) モーダル
    //
    // 数学はすべて ../lib/align.js (Share_Test からの移植)。ここは UI だけ。
    // 座標系は「生 HE px → 生 MSI px」。表示の -90° 回転は一切絡めないので、
    // 両ペインとも生の向きのまま見せる。
    // =====================================================================
    function heLayerKeys() {
      return Object.keys(atlasData.images || {}).filter(k => /HE_STAIN|IF_STAIN/i.test(k));
    }

    function setupAlignButton() {
      const btn = document.getElementById('align-btn');
      if (!btn) return;
      const heKeys = heLayerKeys();
      const msiKeys = Object.keys(valueRasters);
      if (!heKeys.length || !msiKeys.length) {
        btn.disabled = true;
        btn.title = !heKeys.length
          ? 'HE / IF 染色画像が登録されていないため重ね合わせできません'
          : 'MSI の生値ラスタが無いため重ね合わせできません';
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        return;
      }
      btn.addEventListener('click', () => openAlignModal(heKeys[0], msiKeys[0]));
    }

    function openAlignModal(heKey, msiKey0) {
      const heImg = imageSources[heKey];
      if (!heImg || !heImg.complete || !heImg.naturalWidth) { alert('HE 画像がまだ読み込まれていません。'); return; }

      const msiKeys = Object.keys(valueRasters);
      const saved = (atlasData.alignment && atlasData.alignment[heKey]) || null;
      const state = Object.assign(
        Align.defaultAlignState(),
        saved ? {
          flip_lr: !!saved.flip_lr, flip_ud: !!saved.flip_ud,
          scale_pct: saved.scale_pct, rotate_deg: saved.rotate_deg,
          offx: saved.offx, offy: saved.offy,
        } : ZipIO.stateFromT(atlasData.world_coords && atlasData.world_coords.T_he_to_msi),
        {}
      );
      state.landmarks = {
        he: (saved && saved.landmarks && saved.landmarks.he ? saved.landmarks.he.map(p => p.slice()) : []),
        msi: (saved && saved.landmarks && saved.landmarks.msi ? saved.landmarks.msi.map(p => p.slice()) : []),
      };
      let autoMeta = (saved && saved.autoAligned) || null;
      let msiKey = msiKeys.indexOf(msiKey0) >= 0 ? msiKey0 : msiKeys[0];
      let pickMode = null;   // 'he' | 'msi' | null

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal-box">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-semibold">重ね合わせ — ${formatDisplayName(heKey)} → MSI</h3>
            <button class="text-gray-400 hover:text-gray-700 text-xl leading-none" data-act="close">&times;</button>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <!-- HE ペイン -->
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-medium text-gray-700">HE (生の向き)</span>
                <button class="text-xs px-2 py-0.5 rounded border border-gray-300 hover:bg-gray-50" data-pick="he">対応点を打つ</button>
              </div>
              <div class="pick-pane" data-pane="he"><img data-img="he"></div>
            </div>
            <!-- MSI ペイン -->
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-medium text-gray-700">MSI
                  <select data-sel="msi" class="text-xs border-gray-300 rounded ml-1 py-0"></select>
                </span>
                <button class="text-xs px-2 py-0.5 rounded border border-gray-300 hover:bg-gray-50" data-pick="msi">対応点を打つ</button>
              </div>
              <div class="pick-pane" data-pane="msi"><img data-img="msi"></div>
            </div>
            <!-- プレビュー -->
            <div>
              <div class="text-xs font-medium text-gray-700 mb-1">プレビュー (緑 = HE 輪郭)</div>
              <div class="pick-pane"><img data-img="preview"></div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3 mt-3">
            <!-- パラメータ -->
            <div class="text-xs space-y-1">
              <div class="font-medium text-gray-700 mb-1">変換パラメータ</div>
              <label class="flex items-center gap-1"><input type="checkbox" data-p="flip_lr" class="h-3 w-3"> 左右反転</label>
              <label class="flex items-center gap-1"><input type="checkbox" data-p="flip_ud" class="h-3 w-3"> 上下反転</label>
              <div class="flex items-center gap-1"><span class="w-14 text-gray-500">スケール</span><input type="number" step="any" data-p="scale_pct" class="w-24 border border-gray-300 rounded px-1 py-0.5"><span class="text-gray-400">%</span></div>
              <div class="flex items-center gap-1"><span class="w-14 text-gray-500">回転</span><input type="number" step="any" data-p="rotate_deg" class="w-24 border border-gray-300 rounded px-1 py-0.5"><span class="text-gray-400">°</span></div>
              <div class="flex items-center gap-1"><span class="w-14 text-gray-500">X 移動</span><input type="number" step="any" data-p="offx" class="w-24 border border-gray-300 rounded px-1 py-0.5"><span class="text-gray-400">px</span></div>
              <div class="flex items-center gap-1"><span class="w-14 text-gray-500">Y 移動</span><input type="number" step="any" data-p="offy" class="w-24 border border-gray-300 rounded px-1 py-0.5"><span class="text-gray-400">px</span></div>
              <div class="pt-2">
                <button class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-50 w-full" data-act="auto">自動整合 (シルエット)</button>
              </div>
            </div>

            <!-- 対応点 -->
            <div class="text-xs">
              <div class="flex items-center justify-between mb-1">
                <span class="font-medium text-gray-700">対応点 (半自動)</span>
                <span>
                  <button class="px-1.5 py-0.5 rounded border border-gray-300 hover:bg-gray-50" data-act="undo">1 点戻す</button>
                  <button class="px-1.5 py-0.5 rounded border border-gray-300 hover:bg-gray-50" data-act="clear">全消去</button>
                </span>
              </div>
              <div data-el="qc" class="mb-1"></div>
              <div data-el="table" class="max-h-32 overflow-y-auto border border-gray-200 rounded"></div>
              <button class="mt-1 w-full px-2 py-1 rounded border border-gray-300 hover:bg-gray-50" data-act="solve">対応点から解く (Solve)</button>
            </div>

            <!-- 結果 -->
            <div class="text-xs">
              <div class="font-medium text-gray-700 mb-1">評価</div>
              <div data-el="report" class="text-gray-600 leading-relaxed"></div>
            </div>
          </div>

          <div class="flex justify-end gap-2 mt-4 pt-3 border-t">
            <button class="px-3 py-1 text-xs rounded border border-gray-300 hover:bg-gray-50" data-act="close">キャンセル</button>
            <button class="px-3 py-1 text-xs rounded bg-blue-600 text-white hover:bg-blue-700" data-act="apply">適用して保存</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);

      const q = (sel) => backdrop.querySelector(sel);
      const heImgEl = q('[data-img="he"]');
      const msiImgEl = q('[data-img="msi"]');
      const prevImgEl = q('[data-img="preview"]');
      const msiSel = q('[data-sel="msi"]');

      msiKeys.forEach(k => msiSel.add(new Option(formatDisplayName(k), k)));
      msiSel.value = msiKey;

      // ---- 描画 ----------------------------------------------------------
      heImgEl.src = atlasData.images[heKey];

      function msiCanvas() {
        const vr = valueRasters[msiKey];
        const st = imageSettings[msiKey] || {};
        return MSIRaster.paintRasterToCanvas(vr.values, vr.W, vr.H, {
          color: null, win: { min: st.vmin, max: st.vmax }, gamma: 0.5,
        });
      }
      function refreshMsiPane() { msiImgEl.src = msiCanvas().toDataURL(); }

      function umPerPxNow() {
        const wc = atlasData.world_coords || {};
        return wc.msi_um_per_px || null;
      }

      // HE の緑マスクは T に依存しないので 1 度だけ作って使い回す。
      // ★ 毎回作り直すと、スライダーを 1 つ動かすたびに HE 全画素を読み直すことになり、
      //   大きな TIFF (数千 px 角) では操作が固まる。
      // 作業解像度も HE_MASK_MAX_EDGE 相当に落とす (プレビューの見た目には十分)。
      let heTintCanvas = null;
      function heTint() {
        if (heTintCanvas) return heTintCanvas;
        const rawW = heImg.naturalWidth, rawH = heImg.naturalHeight;
        const k = Math.max(1, Math.max(rawW, rawH) / 1024);
        const w = Math.max(8, Math.round(rawW / k)), h = Math.max(8, Math.round(rawH / k));
        const tint = document.createElement('canvas');
        tint.width = w; tint.height = h;
        const tctx = tint.getContext('2d', { willReadFrequently: true });
        tctx.imageSmoothingEnabled = true;
        tctx.imageSmoothingQuality = 'high';
        tctx.drawImage(heImg, 0, 0, w, h);
        const d = tctx.getImageData(0, 0, w, h);
        const px = d.data;
        for (let i = 0; i < px.length; i += 4) {
          const mx = Math.max(px[i], px[i + 1], px[i + 2]);
          const mn = Math.min(px[i], px[i + 1], px[i + 2]);
          const sat = mx ? (mx - mn) / mx : 0;
          const on = sat > Align.HE_MASK_SAT_MIN && mx / 255 < Align.HE_MASK_VAL_MAX;
          px[i] = 0; px[i + 1] = on ? 220 : 0; px[i + 2] = 0; px[i + 3] = 255;
        }
        tctx.putImageData(d, 0, 0);
        // 生 HE ピクセル座標系に戻すための倍率を持たせておく
        tint._sx = rawW / w; tint._sy = rawH / h;
        heTintCanvas = tint;
        return tint;
      }

      function refreshPreview() {
        const vr = valueRasters[msiKey];
        const T = Align.buildHeToMsiAffine(state);
        const c = document.createElement('canvas');
        c.width = vr.W; c.height = vr.H;
        const ctx = c.getContext('2d');
        ctx.drawImage(msiCanvas(), 0, 0);
        // HE を T で MSI 座標系に写して緑で重ねる
        const tint = heTint();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.55;
        ctx.transform(T[0][0], T[1][0], T[0][1], T[1][1], T[0][2], T[1][2]);
        // tint は縮小してあるので、生 HE 座標に戻してから T に載せる
        ctx.scale(tint._sx, tint._sy);
        ctx.drawImage(tint, 0, 0);
        ctx.restore();
        prevImgEl.src = c.toDataURL();
      }

      function syncInputsFromState() {
        backdrop.querySelectorAll('[data-p]').forEach(el => {
          const k = el.dataset.p;
          if (el.type === 'checkbox') el.checked = !!state[k];
          else el.value = Number(Number(state[k]).toPrecision(8));
        });
      }

      function renderLandmarks() {
        for (const which of ['he', 'msi']) {
          const pane = q(`[data-pane="${which}"]`);
          pane.querySelectorAll('.pick-dot').forEach(n => n.remove());
          const img = which === 'he' ? heImgEl : msiImgEl;
          const nW = img.naturalWidth || 1, nH = img.naturalHeight || 1;
          state.landmarks[which].forEach((p, i) => {
            const dot = document.createElement('div');
            dot.className = 'pick-dot';
            dot.style.left = (p[0] / nW * 100) + '%';
            dot.style.top = (p[1] / nH * 100) + '%';
            dot.style.background = which === 'he' ? '#22c55e' : '#f97316';
            dot.textContent = String(i + 1);
            pane.appendChild(dot);
          });
        }
        renderResiduals();
      }

      function renderResiduals() {
        const T = Align.buildHeToMsiAffine(state);
        const resid = Align.computeLandmarkResiduals(state.landmarks, T, umPerPxNow());
        const nHe = state.landmarks.he.length, nMsi = state.landmarks.msi.length;
        const vr = valueRasters[msiKey];

        // 点の分布の良し悪し
        const geo = Align.assessLandmarkGeometry(state.landmarks.msi, vr.W, vr.H);
        let qc = '';
        if (nHe !== nMsi) qc = `<span class="text-amber-700">HE ${nHe} 点 / MSI ${nMsi} 点 — 数を揃えてください</span>`;
        else if (nHe < 3) qc = `<span class="text-red-700">${nHe} 点 — 3 点以上を推奨 (2 点では残差が必ず 0 になり誤差が測れません)</span>`;
        else if (geo.spread < 0.33) qc = `<span class="text-amber-700">点が狭い範囲に固まっています (spread ${geo.spread.toFixed(2)}) — 外周に散らしてください</span>`;
        else qc = `<span class="text-green-700">${nHe} 点 / 分布 ${geo.spread.toFixed(2)}</span>`;
        q('[data-el="qc"]').innerHTML = qc;

        const outlierCut = (resid && resid.n >= 3) ? resid.rmse_px * 2.5 : Infinity;
        let html = '<table class="w-full text-[11px]"><thead class="bg-gray-50 text-gray-500"><tr>' +
          '<th class="px-1 text-left">#</th><th class="px-1 text-right">Δ px</th><th class="px-1 text-right">Δ µm</th></tr></thead><tbody>';
        if (resid) {
          for (const p of resid.perPoint) {
            const cls = p.d > outlierCut ? ' class="resid-out"' : '';
            html += `<tr${cls}><td class="px-1">${p.i + 1}</td><td class="px-1 text-right">${p.d.toFixed(2)}</td>` +
              `<td class="px-1 text-right">${Number.isFinite(p.dUm) ? p.dUm.toFixed(1) : '—'}</td></tr>`;
          }
        }
        html += '</tbody></table>';
        q('[data-el="table"]').innerHTML = html;

        let rep = '';
        if (resid) {
          rep += `<div>対応点 RMSE: <b>${resid.rmse_px.toFixed(2)} px</b>` +
            (Number.isFinite(resid.rmse_um) ? ` (${resid.rmse_um.toFixed(1)} µm)` : '') + '</div>';
          rep += `<div>最大: ${resid.max_px.toFixed(2)} px` +
            (Number.isFinite(resid.max_um) ? ` (${resid.max_um.toFixed(1)} µm)` : '') + '</div>';
        }
        if (autoMeta) {
          rep += `<div class="mt-1 text-gray-500">自動整合: Dice ${Number(autoMeta.dice).toFixed(4)} / ` +
            `異方性 ${Number(autoMeta.aniso).toFixed(3)}${autoMeta.blended ? ' / 手動と合成' : ''}</div>`;
          if (autoMeta.reliableRotation === false) {
            rep += '<div class="text-red-700">⚠ 組織がほぼ回転対称です。この形では回転角を決められません — 対応点で確認してください。</div>';
          }
        }
        q('[data-el="report"]').innerHTML = rep || '<span class="text-gray-400">対応点を打つか自動整合を実行してください。</span>';
      }

      function refreshAll() { syncInputsFromState(); renderLandmarks(); refreshPreview(); }

      // ---- 操作 ----------------------------------------------------------
      backdrop.querySelectorAll('[data-p]').forEach(el => {
        el.addEventListener('change', () => {
          const k = el.dataset.p;
          state[k] = el.type === 'checkbox' ? el.checked : Number(el.value);
          autoMeta = null;
          refreshAll();
        });
      });

      msiSel.addEventListener('change', () => {
        msiKey = msiSel.value;
        refreshMsiPane();
        // ★ setTimeout(...,0) では新しい <img> のデコードが終わっておらず、
        //   renderLandmarks が前のラスタの naturalWidth で点を配置してしまう。
        //   (分子ごとにグリッドが違う場合に位置がずれる)
        if (msiImgEl.complete && msiImgEl.naturalWidth) refreshAll();
        else msiImgEl.addEventListener('load', refreshAll, { once: true });
      });

      backdrop.querySelectorAll('[data-pick]').forEach(b => {
        b.addEventListener('click', () => {
          const which = b.dataset.pick;
          pickMode = pickMode === which ? null : which;
          backdrop.querySelectorAll('[data-pane]').forEach(p => {
            p.classList.toggle('active', p.dataset.pane === pickMode);
          });
        });
      });

      for (const which of ['he', 'msi']) {
        q(`[data-pane="${which}"]`).addEventListener('click', (ev) => {
          if (pickMode !== which) return;
          const img = which === 'he' ? heImgEl : msiImgEl;
          if (!img.naturalWidth) return;
          const r = img.getBoundingClientRect();
          // ペインは生の向きで出しているので、表示比で割り戻すだけで生 px になる
          const x = (ev.clientX - r.left) / Math.max(1, r.width) * img.naturalWidth;
          const y = (ev.clientY - r.top) / Math.max(1, r.height) * img.naturalHeight;
          state.landmarks[which].push([x, y]);
          renderLandmarks();
        });
      }

      q('[data-act="undo"]').addEventListener('click', () => {
        // 数が多いほうを 1 点戻す (打ち間違いは必ず片側だけ多い状態で気づく)
        const he = state.landmarks.he, msi = state.landmarks.msi;
        if (he.length > msi.length) he.pop();
        else if (msi.length > he.length) msi.pop();
        else { he.pop(); msi.pop(); }
        renderLandmarks();
      });
      q('[data-act="clear"]').addEventListener('click', () => {
        state.landmarks.he = []; state.landmarks.msi = [];
        renderLandmarks();
      });

      q('[data-act="solve"]').addEventListener('click', () => {
        try {
          const fit = Align.solveAlignFromLandmarks(state.landmarks, state.flip_lr, state.flip_ud);
          if (!fit) throw new Error('対応点が 2 組以上必要です');
          Object.assign(state, fit);
          autoMeta = null;
          refreshAll();
        } catch (e) {
          alert('Solve に失敗しました: ' + e.message);
        }
      });

      q('[data-act="auto"]').addEventListener('click', async () => {
        const btn = q('[data-act="auto"]');
        btn.disabled = true;
        const prev = btn.textContent;
        btn.textContent = '組織シルエットを抽出中…';
        await new Promise(r => requestAnimationFrame(() => r()));
        try {
          const heM = Align.heTissueMask(heImg);
          if (!heM) throw new Error('HE から組織領域を抽出できませんでした (背景との彩度差が小さい可能性があります)');
          const vr = valueRasters[msiKey];
          const msiM = Align.msiTissueMaskFromValues(vr.values, vr.W, vr.H);
          if (!msiM) throw new Error('MSI から組織領域を抽出できませんでした');

          // 両側の µm/px が判っていればスケールは自由変数ではない
          const wc = atlasData.world_coords || {};
          const heUm = wc.he_um_per_px;
          const msiUm = wc.msi_um_per_px;
          const heMean = heUm && heUm.x > 0 && heUm.y > 0 ? (Number(heUm.x) + Number(heUm.y)) / 2 : 0;
          const msiMean = msiUm && msiUm.x > 0 && msiUm.y > 0 ? (Number(msiUm.x) + Number(msiUm.y)) / 2 : 0;
          const lockScale = (heMean > 0 && msiMean > 0) ? (heMean / msiMean) : 0;

          const auto = Align.autoAlignSilhouette(heM, msiM, lockScale ? { lockScale: lockScale } : null);
          if (!auto) throw new Error('シルエットからの推定に失敗しました');

          const Tcur = Align.buildHeToMsiAffine(state);
          const Tauto = Align.buildHeToMsiAffine(auto.state);
          const dCur = Align.transformDisagreementPx(heM, Tcur, Tauto);

          // 手動解があれば逆分散でブレンドする
          let hybrid = null, sigMan = null;
          const manual = Align.solveAlignFromLandmarks(state.landmarks, state.flip_lr, state.flip_ud);
          if (manual) {
            const manResid = Align.computeLandmarkResiduals(state.landmarks, Align.buildHeToMsiAffine(manual), umPerPxNow());
            sigMan = Align.estimateLandmarkFitSigmaPx(manResid);
            const dManAuto = Align.transformDisagreementPx(heM, Align.buildHeToMsiAffine(manual), Tauto);
            if (sigMan) {
              const wMan = 1 / (sigMan * sigMan);
              const wAuto = 1 / (auto.sigmaPx * auto.sigmaPx);
              // ★ 一貫性チェック: 手動解と自動解が合成不確かさの 3 倍より離れていたら
              //   どちらかが壊れている。平均せず両方見せる。
              const tol = 3 * Math.sqrt(sigMan * sigMan + auto.sigmaPx * auto.sigmaPx);
              if (Number.isFinite(dManAuto) && dManAuto <= tol) {
                hybrid = Align.blendAlignStates(manual, wMan, auto.state, wAuto);
              }
            }
          }

          let html = `<div class="border border-gray-200 rounded p-2 bg-gray-50">` +
            `<div>Dice <b>${auto.dice.toFixed(4)}</b> / 評価 ${auto.evals} 回</div>` +
            `<div>回転 ${auto.state.rotate_deg.toFixed(2)}° / スケール ${auto.state.scale_pct.toFixed(2)}%` +
            (auto.scaleLocked ? ' <span class="text-gray-500">(µm/px から固定)</span>' : '') + '</div>' +
            `<div>現在値との差 ${Number.isFinite(dCur) ? dCur.toFixed(2) + ' px' : '—'}</div>` +
            `<div>期待誤差 ±${auto.sigmaPx.toFixed(1)} px</div>`;
          if (!auto.reliableRotation) {
            html += `<div class="text-red-700 mt-1">⚠ 異方性 ${auto.aniso.toFixed(3)} — 組織がほぼ回転対称で、` +
              `Dice はどの角度でもほぼ同じ値になります。回転角は信用できません。</div>`;
          }
          if (auto.scaleLocked && Math.abs(auto.areaScaleRatio - 1) > 0.05) {
            html += `<div class="text-amber-700 mt-1">⚠ 面積比から出るスケールが固定値と ` +
              `${((auto.areaScaleRatio - 1) * 100).toFixed(1)}% ずれています。µm/px の設定を確認してください。</div>`;
          }
          html += '<div class="mt-2 flex gap-1">' +
            '<button class="px-2 py-0.5 rounded border border-blue-300 bg-white hover:bg-blue-50" data-auto-apply="auto">自動解を適用</button>';
          if (hybrid) html += '<button class="px-2 py-0.5 rounded border border-blue-300 bg-white hover:bg-blue-50" data-auto-apply="hybrid">手動と合成して適用</button>';
          html += '</div></div>';
          q('[data-el="report"]').innerHTML = html;

          q('[data-el="report"]').querySelectorAll('[data-auto-apply]').forEach(b => {
            b.addEventListener('click', () => {
              const which = b.getAttribute('data-auto-apply');
              const chosen = which === 'hybrid' && hybrid ? hybrid : auto.state;
              Object.assign(state, chosen);
              autoMeta = {
                method: 'silhouette-v1', dice: auto.dice, aniso: auto.aniso,
                reliableRotation: auto.reliableRotation, scaleLocked: auto.scaleLocked,
                sigmaPx: auto.sigmaPx, ts: Date.now(),
              };
              if (which === 'hybrid') autoMeta.blended = true;
              refreshAll();
            });
          });
        } catch (e) {
          q('[data-el="report"]').innerHTML = '<div class="text-red-700">' + e.message + '</div>';
        } finally {
          btn.disabled = false;
          btn.textContent = prev;
        }
      });

      backdrop.querySelectorAll('[data-act="close"]').forEach(b => {
        b.addEventListener('click', () => backdrop.remove());
      });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

      q('[data-act="apply"]').addEventListener('click', async () => {
        const T = Align.buildHeToMsiAffine(state);
        atlasData.world_coords = atlasData.world_coords || {};
        atlasData.world_coords.T_he_to_msi = T;
        atlasData.alignment = atlasData.alignment || {};
        atlasData.alignment[heKey] = {
          flip_lr: state.flip_lr, flip_ud: state.flip_ud,
          scale_pct: state.scale_pct, rotate_deg: state.rotate_deg,
          offx: state.offx, offy: state.offy,
          landmarks: { he: state.landmarks.he.map(p => p.slice()), msi: state.landmarks.msi.map(p => p.slice()) },
          autoAligned: autoMeta || undefined,
        };
        if (currentProject) {
          currentProject.world_coords = atlasData.world_coords;
          currentProject.alignment = atlasData.alignment;
          try {
            await ProjectStorage.putProject(currentProject);
          } catch (err) {
            // ★ ここで握りつぶすとモーダルが閉じないまま固まり、
            //   ユーザーは保存できたと思い込んでしまう。
            console.error('[align] 保存に失敗:', err);
            alert('位置合わせの保存に失敗しました: ' + err.message +
                  '\n(表示には反映しますが、保存されていません)');
          }
        }
        backdrop.remove();
        renderCompositeImage();
      });

      refreshMsiPane();
      // 画像の読み込みが終わってから点とプレビューを描く
      const ready = [];
      for (const im of [heImgEl, msiImgEl]) {
        if (!im.complete || !im.naturalWidth) ready.push(new Promise(r => im.addEventListener('load', r, { once: true })));
      }
      Promise.all(ready).then(refreshAll);
    }

    // =====================================================================
    // データ読み込み
    // =====================================================================
    async function loadAtlasJsonExternal(atlasId) {
      const url = `../datasets/${atlasId}/atlas.json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`atlas.json fetch failed: ${res.status} ${url}`);
      return await res.json();
    }

    /** 静的データセット (?atlas=) を読む。MSI は生値ラスタも作る。 */
    async function loadStaticAtlas(atlasId) {
      const external = await loadAtlasJsonExternal(atlasId);
      const baseDir = `../datasets/${atlasId}/`;
      atlasData = {
        meta: external.meta || { format: 'roi_bundle_v1' },
        roi: external.roi || {},
        images: {},
        world_coords: external.world_coords || {},
        alignment: external.alignment || {},
        thumbnail_order: Array.isArray(external.thumbnail_order) ? external.thumbnail_order : [],
      };
      const resolve = (v) => (typeof v === 'string' && !/^data:|^https?:|^\.\.\//.test(v))
        ? baseDir + encodeURI(v) : v;

      for (const [k, v] of Object.entries(external.images || {})) atlasData.images[k] = resolve(v);

      const addRaster = (key, rows) => {
        const r = MSIRaster.rasterFromRows(rows);
        r.stats = MSIRaster.deriveBakeStats(r.values);
        valueRasters[key] = r;
        atlasData.images[key] = MSIRaster.bakeToPngDataUrl(r.values, r.W, r.H, r.stats.bakeLo, r.stats.bakeHi);
      };

      for (const [key, def] of Object.entries(external.txt_series || {})) {
        try {
          const src = resolve(def.src);
          const res = await fetch(src);
          if (!res.ok) throw new Error(`txt fetch failed: ${res.status}`);
          const { rows } = Ingest.rowsFromText(await res.text(), def);
          addRaster(key, rows);
        } catch (e) { console.warn('txt -> ラスタ生成に失敗:', key, e); }
      }
      for (const [key, def] of Object.entries(external.xlsx_series || {})) {
        try {
          const src = resolve(def.src);
          const res = await fetch(src);
          if (!res.ok) throw new Error(`xlsx fetch failed: ${res.status}`);
          const wb = Ingest.workbookFromArrayBuffer(await res.arrayBuffer());
          addRaster(key, Ingest.rowsFromWorkbook(wb, def));
        } catch (e) { console.warn('xlsx -> ラスタ生成に失敗:', key, e); }
      }
    }

    /** 登録済みプロジェクト (?project=) を IndexedDB から読む。 */
    async function loadProject(projectId) {
      const p = await ProjectStorage.getProject(projectId);
      if (!p) throw new Error('登録データが見つかりません (id=' + projectId + ')');
      currentProject = p;

      atlasData = {
        meta: { format: 'roi_bundle_v1', dataset_id: p.displayName },
        roi: p.roi || { roi_items: {}, roi_names: {}, palette: {}, roi_show_flags: {} },
        images: {},
        world_coords: p.world_coords || {},
        alignment: p.alignment || {},
        thumbnail_order: (p.molecules || []).map(m => m.key),
      };

      for (const m of (p.molecules || [])) {
        const values = await ProjectStorage.getValueRaster(m.blobId);
        if (!values) { console.warn('[loadProject] ラスタが見つかりません', m.key); continue; }
        const r = { values: values, W: p.grid.W, H: p.grid.H };
        r.stats = m.stats || MSIRaster.deriveBakeStats(values);
        valueRasters[m.key] = r;
        atlasData.images[m.key] = MSIRaster.bakeToPngDataUrl(values, r.W, r.H, r.stats.bakeLo, r.stats.bakeHi);
      }

      for (const key of Object.keys(p.images || {})) {
        const im = p.images[key];
        try {
          const rec = await ProjectStorage.getBlob(im.blobId);
          if (!rec || !rec.blob) throw new Error('blob がありません');
          atlasData.images[key] = await Ingest.imageBlobToDataUrl(rec.blob, im.filename);
        } catch (e) {
          console.warn('[loadProject] 画像の復元に失敗', key, e);
        }
      }

      if (p.otsu) {
        otsuState.applied = !!p.otsu.applied;
        otsuState.strength = Number(p.otsu.strength) || 0;
        otsuState.manualThreshold = p.otsu.manualThreshold != null ? Number(p.otsu.manualThreshold) : null;
      }
      if (p.viewerTransform) {
        viewTransform.tx = Number(p.viewerTransform.tx) || 0;
        viewTransform.ty = Number(p.viewerTransform.ty) || 0;
        viewTransform.scale = Number(p.viewerTransform.scale) || 1;
      }
      const title = document.getElementById('atlas-title');
      if (title) title.textContent = p.displayName;
    }

    // =====================================================================
    // ブートストラップ
    // =====================================================================
    (async () => {
      const params = new URLSearchParams(location.search);
      const projectId = params.get('project');
      const atlasId = params.get('atlas');
      try {
        if (!projectId && !atlasId) {
          // 開くものが指定されていなければ master 画面に戻す
          location.replace('../index.html');
          return;
        }
        if (projectId) await loadProject(projectId);
        else await loadStaticAtlas(atlasId);
        await domReady;
        await initializeViewer();
      } catch (e) {
        console.error(e);
        await domReady;
        const viewer = document.getElementById('image-viewer');
        if (viewer) {
          viewer.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-red-300 text-sm p-4 text-center">' +
            'データの読み込みに失敗しました: ' + String(e.message || e) +
            '<br><a href="../index.html" class="underline text-blue-300 mt-2 inline-block">Master 画面へ戻る</a></div>';
        }
      }
    })();</script>


    <div id="buildTag" style="position:fixed;bottom:4px;right:6px;font-size:10px;color:#94a3b8;pointer-events:none;z-index:50;"></div>
    <script>document.getElementById('buildTag').textContent = 'v:rot-fix-2';</script>

</body>
