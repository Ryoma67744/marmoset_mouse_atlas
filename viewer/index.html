<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Marmoset Brain Atlas Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/otsu.js"></script>
    <script src="../lib/align.js"></script>
    <script src="../lib/msi.js"></script>
    <script src="../lib/ingest.js"></script>
    <script src="../lib/imzml.js"></script>
    <script src="../lib/zipio.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f5; }
        .roi-item { cursor: pointer; transition: background-color 0.2s; }
        .roi-item:hover, .roi-item.active { background-color: #e0f2fe; border-left-color: #3b82f6; }
        .color-swatch { width: 1rem; height: 1rem; border-radius: 0.25rem; display: inline-block; margin-right: 0.5rem; vertical-align: middle; border: 1px solid #ccc; }
        .thumbnail {
          width: 100%;
          height: auto;
          max-height: 170px;
          display: block;
          cursor: pointer;
          border: 1px solid transparent;
          transition: border-color 0.2s;
          object-fit: contain;
          border-radius: 0.25rem;
          background-color: transparent;
        }
        .heif-thumb {
          width: 100%;
          height: auto;
          max-width: 100%;
          max-height: 170px;
          object-fit: contain;
          display: block;
        }
        .msi-thumb {
          width: 100% !important;
          height: auto !important;
          max-width: 100% !important;
          max-height: 170px !important;
          background-color: transparent !important;
          object-fit: contain;
          display: inline-block;
        }
        .thumbnail.active, .thumbnail:hover { border-color: #3b82f6; }
        .settings-panel input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
            background: #d1d5db; border-radius: 2px; outline: none;
        }
        .settings-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            background: #3b82f6; cursor: pointer; border-radius: 50%;
        }
        .settings-panel input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; background: #3b82f6; cursor: pointer;
            border-radius: 50%; border: none;
        }
        /* ROI toggle switch */
        #roi-toggle:checked ~ #roi-toggle-bg { background-color: #3b82f6; }
        #roi-toggle:checked ~ #roi-toggle-dot { transform: translateX(1rem); }
        /* Image Viewer を反時計回りに 90° 追加回転するためのラッパ。
           パン/ズームは CSS 変数でこの同じ transform に載せる。
           ★ canvas 要素自体が transform されるので、ROI 描画の click ハンドラが使う
             event.offsetX/offsetY は「変換前のローカル座標」のまま届く。
             したがって canvasToMsi() 以下の座標計算はパン/ズームの影響を受けない。 */
        #image-viewer-rot {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
            transform: translate(var(--vt-tx, 0px), var(--vt-ty, 0px))
                       rotate(-90deg)
                       scale(var(--vt-scale, 1));
        }
        #image-viewer { touch-action: none; }
        #image-viewer.panning { cursor: grabbing; }
        #image-viewer.pannable { cursor: grab; }

        /* 常時表示のレイヤ選択リスト (旧: プルダウン) */
        #image-selector-options { max-height: 190px; overflow-y: auto; }
        .layer-row { border-bottom: 1px solid #f1f5f9; }
        .layer-row:last-child { border-bottom: none; }

        /* 大津法ヒストグラム */
        #otsu-panel canvas { display: block; width: 100%; height: 90px; cursor: ew-resize; }

        /* 位置合わせモーダル */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            display: flex; align-items: center; justify-content: center; z-index: 60;
        }
        .modal-box {
            background: #fff; border-radius: 8px; width: min(1080px, 96vw);
            max-height: 94vh; overflow: auto; padding: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,.3);
        }
        .pick-pane { position: relative; background: #000; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; }
        .pick-pane img { display: block; width: 100%; height: auto; }
        .pick-pane.active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.35); cursor: crosshair; }
        .pick-dot {
            position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
            border: 2px solid #fff; border-radius: 50%; box-sizing: border-box;
            font-size: 9px; line-height: 10px; text-align: center; color: #fff;
            pointer-events: none; text-shadow: 0 0 2px #000;
        }
        .resid-out { background: #fef2f2; color: #b91c1c; }
        /* サムネイルを Image Viewer と同じ向きで見せるラッパ。
           MSI サムネだけ −180° 回転し、HE/IF は T_he_to_msi が画像内部で
           既に 180° を吸収しているため 0° のまま表示する。 */
        .thumb-rot-box {
            position: relative;
            width: 100%;
            aspect-ratio: var(--rot-ar, 1 / 1);
            max-height: 170px;
            overflow: hidden;
        }
        .thumb-rot-box > img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: 50% 50%;
        }
        .thumb-rot-box > img.msi-thumb {
            transform: rotate(-180deg);
        }
        .thumb-rot-box > .thumbnail {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="text-gray-800">

                    <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>

                <button id="import-zip" class="inline-flex items-center gap-1 px-3 py-1 text-xs font-medium rounded border border-gray-300 bg-white hover:bg-gray-50 text-gray-700" title="Export した ZIP を読み込んで続きから作業する">
                    <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M7.5 9 12 4.5m0 0L16.5 9M12 4.5V16"/></svg>

    <script>
        let atlasData = {
            "meta": { "format": "roi_bundle_v1" },
            "roi": {
                "roi_items": {"sample_roi": [{"poly_msi": [[100, 100], [200, 100], [150, 200]]}]},
                "roi_names": {"sample_roi": "サンプルROI"},
                "palette": {"sample_roi": [255, 0, 0, 255]}
            },
            "images": {
                "HE_Stain": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=",
                "IF_Stain": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==",
                "MSI_DA": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=",
                "MSI_5-HT": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=",
                "MSI_NE": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
            }
        };

        const sizingImage = document.getElementById('sizing-image');
        const roiCanvas = document.getElementById('roi-canvas');
        const displayCanvas = document.getElementById('display-canvas');
        let roiCtx = null;
        let displayCtx = null;
        let imageSources = {};
        let imageSettings = {};
        let isRendering = false;

        // MSI の生値ラスタ (key -> {values: Float32Array, W, H})。
        // 8bit の PNG では生単位の強度ウィンドウも大津法もできないので、
        // 取り込み時に作った float をそのまま持ち回る。
        let valueRasters = {};
        // IndexedDB から開いたプロジェクト (静的データセットの場合は null)
        let currentProject = null;
        // 大津法の状態
        let otsuState = { applied: false, strength: 0, manualThreshold: null, record: null };
        // パン / ズーム
        let viewTransform = { tx: 0, ty: 0, scale: 1 };

        // MSI サムネイル要素を key → <img> で保持(輝度変更時に再描画するため)
        const msiThumbRefs = new Map();
        // ユーザー描画 ROI の内部キーは "user_" プレフィックス
        const USER_ROI_PREFIX = 'user_';
        // 描画モードの状態
        let drawingMode = false;
        let drawingVertices = [];

        // MSI化合物ごとの色マッピング（同じ化合物は常に同じ色）
        const MSI_COMPOUND_COLORS = {
            'DA':   [255, 0,   0  ],  // 赤
            '5-HT': [0,   255, 0  ],  // 緑
            'NE':   [255, 255, 0  ],  // 黄色
            'GABA': [0,   200, 255],  // シアン
            'Glu':  [255, 0,   255],  // マゼンタ
            'ACh':  [255, 128, 0  ],  // オレンジ
        };
        // MSIキー名から化合物名を抽出して色を取得
        function getMsiColor(key) {
            if (!key || !key.toUpperCase().startsWith('MSI_')) return null;
            const compound = key.replace(/^MSI_/i, '');
            return MSI_COMPOUND_COLORS[compound] || null;
        }

        // MSI サムネイルを imageSources から着色+CCW90°回転で再描画する。
        // vmin/vmax が変わるたびに呼び直すために抽出。
        function renderMsiThumbnail(key, thumbEl) {
            if (!thumbEl) return;
            // 生値ラスタがあるならそちらから描く (生単位のウィンドウ + 大津法が効く)
            const vr = valueRasters[key];
            if (vr) {
                const st = imageSettings[key] || {};
                const canvas = MSIRaster.paintRasterToCanvas(vr.values, vr.W, vr.H, {
                    color: getMsiColor(key),
                    win: { min: st.vmin, max: st.vmax },
                    gamma: 0.5,
                    keep: otsuKeepFor(key),
                });
                thumbEl.src = canvas.toDataURL();
                thumbEl.classList.add('msi-thumb');
                return;
            }
            const source = imageSources[key];
            if (!source || !source.complete || source.naturalWidth === 0) return;
            const color = getMsiColor(key);
            const iw = source.naturalWidth;
            const ih = source.naturalHeight;
            const tc = document.createElement('canvas');
            tc.width = iw; tc.height = ih;
            const tctx = tc.getContext('2d', { willReadFrequently: true });
            tctx.drawImage(source, 0, 0);
            const imgData = tctx.getImageData(0, 0, iw, ih);
            const d = imgData.data;
            const st = imageSettings[key] || { vmin: 0, vmax: 255 };
            const lumMin = st.vmin;
            const lumRange = (st.vmax - st.vmin) || 1;
            const gamma = 0.5;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i+3] === 0) continue;
                const l = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
                if (l < 1) { d[i] = 0; d[i+1] = 0; d[i+2] = 0; continue; }
                const n = Math.max(0, Math.min(1, (l - lumMin) / lumRange));
                const bright = Math.pow(n, gamma);
                if (color) {
                    d[i]   = Math.min(255, Math.round(color[0] * bright));
                    d[i+1] = Math.min(255, Math.round(color[1] * bright));
                    d[i+2] = Math.min(255, Math.round(color[2] * bright));
                } else {
                    const v = Math.min(255, Math.round(255 * bright));
                    d[i] = v; d[i+1] = v; d[i+2] = v;
                }
            }
            tctx.putImageData(imgData, 0, 0);
            // 回転は親 .thumb-rot-box の CSS transform に一本化。ここでは着色済み
            // 非回転データ URL を src に差し替えるだけ。
            thumbEl.src = tc.toDataURL();
            thumbEl.classList.add('msi-thumb');
        }

        // DOMContentLoaded でコンテキスト初期化 → resolve で IIFE に通知
        function initCanvasContexts() {
            if (!roiCtx)    roiCtx    = roiCanvas.getContext('2d');
            if (!displayCtx) displayCtx = displayCanvas.getContext('2d', { willReadFrequently: true });
        }
        const domReady = new Promise(resolve => {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() { initCanvasContexts(); resolve(); });
            } else {
                initCanvasContexts(); resolve();
            }
        });

        async function initializeViewer() {
            populateRoiList();
            await loadAllImages();
            // ★ 設定 (生単位のウィンドウ) を先に作る。サムネイルを先に描くと
            //   imageSettings がまだ無く、既定ウィンドウ [0,1] で真っ白に焼ける。
            await analyzeAndInitializeSettings();
            // ★ 保存された背景除去の状態は最初の描画前に反映しておく。
            //   setupOtsuUi まで待つと、初回のサムネイルと合成に効かない。
            if (otsuState.applied) recomputeOtsu();
            populateThumbnails();
            setupCheckboxDropdown();
            setupGraphSelector();
            setupCollapsibleSections();
            setupDrawingHandlers();
            setupZipButtons();
            setupViewTransform();
            setupOtsuUi();
            setupAlignButton();
            const firstRoiKey = (atlasData.roi && atlasData.roi.roi_items) ? Object.keys(atlasData.roi.roi_items)[0] : null;
            if (firstRoiKey) {
                setTimeout(() => {
                    const firstRoiElement = document.querySelector('.roi-item[data-roi-key="' + CSS.escape(firstRoiKey) + '"]');
                    if (firstRoiElement) firstRoiElement.click();
                }, 0);
            }
        }

function loadAllImages() {
    const imageKeys = atlasData.images ? Object.keys(atlasData.images) : [];
    const promises = imageKeys.map(async (key) => {
        const rawSrc = atlasData.images[key];
        if (!rawSrc) return { key, ok: false };
        let src = rawSrc;
        if (typeof src === "string" && Ingest.isTiffName(src)) {
            try {
                const res = await fetch(src);
                if (!res.ok) throw new Error(`tiff fetch failed: ${res.status}`);
                src = Ingest.decodeTiffArrayBuffer(await res.arrayBuffer());
                atlasData.images[key] = src;
            } catch (e) {
                console.warn(`[loadAllImages] TIFF decode failed for ${key}:`, e);
                return { key, ok: false };
            }
        }
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            imageSources[key] = img;
            img.onload = () => resolve({ key, ok: true });
            img.onerror = () => {
                console.warn(`[loadAllImages] Failed to load image: ${key} ->`, rawSrc);
                resolve({ key, ok: false });
            };
            img.src = src;
        });
    });
    return Promise.allSettled(promises);
}

        async function analyzeAndInitializeSettings() {
            const imageKeys = Object.keys(atlasData.images || {});
            for (const key of imageKeys) {
                // 生値ラスタがある MSI レイヤは「生単位」でウィンドウを持つ。
                // ベイク時 p99.5 クリップ / 既定表示上限 p99 は Share_Test に合わせる。
                const vr = valueRasters[key];
                if (vr) {
                    const saved = (currentProject && currentProject.layerDisplay && currentProject.layerDisplay[key]) || null;
                    const st = vr.stats || (vr.stats = MSIRaster.deriveBakeStats(vr.values));
                    imageSettings[key] = {
                        opacity: saved && Number.isFinite(saved.opacity) ? saved.opacity : 1.0,
                        applyOpacity: saved ? saved.applyOpacity !== false : true,
                        vmin: saved && Number.isFinite(saved.vmin) ? saved.vmin : st.rawMin,
                        vmax: saved && Number.isFinite(saved.vmax) ? saved.vmax : st.rawDispMax,
                        actualMin: st.rawMin,
                        actualMax: st.rawTrueMax,
                        raw: true,
                    };
                    continue;
                }
                const sourceImg = imageSources[key];
                if (!sourceImg || !sourceImg.complete || sourceImg.naturalWidth === 0) {
                     imageSettings[key] = { opacity: 1.0, applyOpacity: true, vmin: 0, vmax: 255, actualMin: 0, actualMax: 255 };
                     continue;
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = sourceImg.naturalWidth;
                tempCanvas.height = sourceImg.naturalHeight;
                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                tempCtx.drawImage(sourceImg, 0, 0);
                
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imageData.data;
                let min = 255, max = 0;
                const isMsi = /^MSI_/i.test(key);

                // 輝度ヒストグラム収集（MSI用）
                const lumValues = isMsi ? [] : null;
                for (let i = 0; i < data.length; i += 4) {
                    if (isMsi && data[i + 3] === 0) continue; // 透明ピクセルは除外
                    const lum = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
                    if (lum < min) min = lum;
                    if (lum > max) max = lum;
                    if (isMsi && lum > 0) lumValues.push(lum); // ゼロ以外を収集
                }

                // MSI: 上位2%を切った98パーセンタイルをvmaxに設定
                let vmax = max;
                if (isMsi && lumValues.length > 0) {
                    lumValues.sort((a, b) => a - b);
                    const p98idx = Math.floor(lumValues.length * 0.98);
                    vmax = lumValues[Math.min(p98idx, lumValues.length - 1)];
                    if (vmax < 1) vmax = max; // フォールバック
                }

                const savedHe = (currentProject && currentProject.layerDisplay && currentProject.layerDisplay[key]) || null;
                imageSettings[key] = {
                    opacity: savedHe && Number.isFinite(savedHe.opacity) ? savedHe.opacity : 1.0,
                    applyOpacity: savedHe ? savedHe.applyOpacity !== false : true,
                    vmin: savedHe && Number.isFinite(savedHe.vmin) ? savedHe.vmin : min,
                    vmax: savedHe && Number.isFinite(savedHe.vmax) ? savedHe.vmax : vmax,
                    actualMin: min,
                    actualMax: max,
                    raw: false,
                };
            }
        }

        function formatDisplayName(key) {
            if (key.startsWith("MSI_")) {
                return `MSI (${key.substring(4).replace('_', '-')})`;
            }
            if (key.includes("HE")) return "HE Stain";
            if (key.includes("IF")) return "IF Stain";
            return key.replace(/_/g, ' ').replace('.png', '').replace(' with ROI', '');
        }

                const settingsPanel = document.createElement('div');

                // 透明度: Share_Test と同じく「透明化の有効 / 無効」を別に持つ
                const opacityDiv = document.createElement('div');
                opacityDiv.innerHTML = `<div class="flex justify-between items-center text-xs text-gray-600">
                                            <label class="flex items-center gap-1 cursor-pointer" title="OFF にするとこのレイヤは常に不透明で描かれます">
                                                <input type="checkbox" class="h-3 w-3 rounded border-gray-300 apply-opacity-input" ${settings.applyOpacity !== false ? 'checked' : ''}>
                                                透明度
                                            </label>
                                            <div class="flex items-center">
                                                <input type="number" min="0" max="100" step="1" value="${Math.round(settings.opacity * 100)}" class="w-16 text-right border border-gray-300 rounded-sm p-0.5 text-xs opacity-input">
                                                <span class="ml-1">%</span>
                                            </div>
                                        </div>`;
                // 強度: 生値ラスタがあるレイヤは生単位、無ければ従来どおり 8bit 輝度
                const isRaw = !!settings.raw;
                const step = isRaw ? 'any' : '1';
                const fmt = (v) => isRaw ? String(Number(Number(v).toPrecision(6))) : String(Math.round(v));
                const rangeDiv = document.createElement('div');
                rangeDiv.innerHTML = `<div class="flex items-center justify-between mb-0.5">
                        <label class="text-xs text-gray-600">強度レンジ ${isRaw ? '(生単位)' : '(輝度 0-255)'}</label>
                        <button type="button" class="range-reset text-xs px-1 rounded border border-gray-300 hover:bg-gray-50" title="自動 (既定) に戻す">⟲</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="number" step="${step}" value="${fmt(settings.vmin)}" class="w-24 text-center border border-gray-300 rounded-sm p-0.5 text-xs vmin-input">
                        <span class="text-gray-500">-</span>

                    </div>
                    <div class="text-[10px] text-gray-400 mt-0.5">実測 ${fmt(settings.actualMin)} 〜 ${fmt(settings.actualMax)}</div>`;

                settingsPanel.append(opacityDiv, rangeDiv);
                optionDiv.append(topRow, settingsPanel);
                optionsContainer.appendChild(optionDiv);

                // チェックで Image Viewer 合成 + サムネイル連動
                checkbox.addEventListener('change', () => {
                    renderCompositeImage();
                    persistVisibleLayers();
                    if (checkbox.checked) {
                        focusThumbnail(key);   // サムネイルをハイライト＆スクロール
                    } else {
                        // 解除時は、他にチェックが残っていればそちらをハイライト
                        const remain = document.querySelector('#image-selector-options input.layer-check:checked');
                        if (remain) focusThumbnail(remain.value);
                        else {
                            // 何も選ばれていなければハイライト解除
                            const thumbs = document.querySelectorAll('#thumbnail-container img.thumbnail');

                settingsButton.addEventListener('click', (e) => { e.stopPropagation(); settingsPanel.classList.toggle('hidden'); });

                const opacityInput = optionDiv.querySelector('.opacity-input');
                opacityInput.addEventListener('change', () => {
                    let percentValue = parseInt(opacityInput.value, 10);
                    if (isNaN(percentValue)) percentValue = 100;
                    percentValue = Math.max(0, Math.min(100, percentValue));
                    opacityInput.value = percentValue;
                    settings.opacity = percentValue / 100.0;
                    renderCompositeImage();
                    persistLayerDisplay();
                });
                const applyOpacityInput = optionDiv.querySelector('.apply-opacity-input');
                applyOpacityInput.addEventListener('change', () => {
                    settings.applyOpacity = applyOpacityInput.checked;
                    opacityInput.disabled = !applyOpacityInput.checked;
                    renderCompositeImage();
                    persistLayerDisplay();
                });
                opacityInput.disabled = settings.applyOpacity === false;

                const vminInput = optionDiv.querySelector('.vmin-input');
                const vmaxInput = optionDiv.querySelector('.vmax-input');
                const applyRange = () => {
                    let vmin = parseFloat(vminInput.value);
                    let vmax = parseFloat(vmaxInput.value);
                    if (!Number.isFinite(vmin)) vmin = settings.actualMin;
                    if (!Number.isFinite(vmax)) vmax = settings.actualMax;
                    if (!(vmax > vmin)) {
                        // 上下が交差したら、直近に触られていない側を最小限ずらす
                        const eps = isRaw ? Math.max(1e-9, Math.abs(vmin) * 1e-6) : 1;
                        vmax = vmin + eps;
                    }
                    settings.vmin = vmin;
                    settings.vmax = vmax;
                    vminInput.value = fmt(vmin);
                    vmaxInput.value = fmt(vmax);
                    renderCompositeImage();
                    if (msiThumbRefs.has(key)) renderMsiThumbnail(key, msiThumbRefs.get(key));
                    persistLayerDisplay();
                };
                vminInput.addEventListener('change', applyRange);
                vmaxInput.addEventListener('change', applyRange);
                optionDiv.querySelector('.range-reset').addEventListener('click', () => {
                    const vr2 = valueRasters[key];
                    if (vr2) {
                        const st2 = vr2.stats || (vr2.stats = MSIRaster.deriveBakeStats(vr2.values));
                        settings.vmin = st2.rawMin; settings.vmax = st2.rawDispMax;
                    } else {
                        settings.vmin = settings.actualMin; settings.vmax = settings.actualMax;
                    }
                    vminInput.value = fmt(settings.vmin);
                    vmaxInput.value = fmt(settings.vmax);
                    renderCompositeImage();
                    if (msiThumbRefs.has(key)) renderMsiThumbnail(key, msiThumbRefs.get(key));
                    persistLayerDisplay();
                });
            });

            if (imageKeys.length > 0) {
                // MSI 座標系をキャンバスの基準にする。MSI が無ければ HE/IF → なんでも の順でフォールバック
                const msiKey0 = imageKeys.find(k => /^MSI_/i.test(k) && atlasData.images[k]);
                const heKey0  = imageKeys.find(k => /HE_STAIN|IF_STAIN/i.test(k) && atlasData.images[k]);
                const firstKey = msiKey0 || heKey0 || imageKeys.find(k => atlasData.images[k]);
                if (firstKey) {
                    const firstImage = imageSources[firstKey];
                    const refIsMsi = !!msiKey0 && firstKey === msiKey0;
                    const heImage  = heKey0 ? imageSources[heKey0] : null;
                    const setCanvasSize = () => {
                        let w = firstImage.naturalWidth;
                        let h = firstImage.naturalHeight;
                        // MSI を基準に採る場合は CCW90° 回転後のランドスケープ寸法をキャンバス内部解像度に
                        if (refIsMsi) { const tmp = w; w = h; h = tmp; }
                        // HE が MSI より高解像なら、HE のディテール保持のためキャンバス内部解像度を倍率アップ
                        let renderScale = 1;
                        if (refIsMsi && heImage && heImage.naturalWidth > 0) {
                            const ratio = Math.max(heImage.naturalWidth / firstImage.naturalWidth,
                                                   heImage.naturalHeight / firstImage.naturalHeight);
                            renderScale = Math.max(1, Math.min(8, Math.ceil(ratio)));
                        }
                        w = Math.round(w * renderScale);
                        h = Math.round(h * renderScale);
                        [displayCanvas, roiCanvas].forEach(c => { c.width = w; c.height = h; });

                        // コンテナにフィットしつつアスペクト比を完全に維持するCSS寸法を計算。
                        // #image-viewer-rot が CSS で −90° 回転するため、可視 bbox は
                        // キャンバス CSS 寸法の w/h を入れ替えた転置になる。
                        // コンテナにフィットさせるのは「回転後の可視 bbox」なので、
                        // h/w（転置アスペクト比）を基準に計算する。
                        const viewer = document.getElementById('image-viewer');
                        const cw = viewer.clientWidth;
                        const ch = viewer.clientHeight;
                        if (cw > 0 && ch > 0) {
                            const displayedRatio = h / w; // 回転後 visible width/height
                            const containerRatio = cw / ch;
                            let cssW, cssH;
                            // 回転後の visible bbox は (visible_W, visible_H) = (cssH, cssW)。
                            // どちらの辺で container に接するかで 2 分岐。
                            if (containerRatio > displayedRatio) {
                                // 高さで制約: visible_H = cssW = ch
                                cssW = ch;
                                cssH = ch * displayedRatio; // = ch * h/w
                            } else {
                                // 幅で制約: visible_W = cssH = cw
                                cssH = cw;
                                cssW = cw / displayedRatio; // = cw * w/h
                            }
                            // Canvas 自身は回転前のローカル座標系で配置する。
                            // 中央合わせは回転ラッパ内部での配置として計算。
                            [displayCanvas, roiCanvas].forEach(c => {
                                c.style.width = cssW + 'px';
                                c.style.height = cssH + 'px';
                                c.style.left = ((cw - cssW) / 2) + 'px';
                                c.style.top = ((ch - cssH) / 2) + 'px';
                            });
                            // 回転ラッパをコンテナ全面に合わせ、中心軸での −90° 回転が
                            // そのままコンテナ中心で行われるようにする。
                            const rotWrap = document.getElementById('image-viewer-rot');
                            if (rotWrap) {
                                rotWrap.style.width = cw + 'px';
                                rotWrap.style.height = ch + 'px';
                            }
                        }

                        renderCompositeImage();
                        drawAllRois();
                        focusThumbnail(firstKey);
                    };
                    if (firstImage && firstImage.complete && firstImage.naturalWidth > 0) setCanvasSize();
                    else if (firstImage) firstImage.addEventListener('load', setCanvasSize, { once: true });

                    // ウィンドウリサイズ時にアスペクト比を再計算
                    window.addEventListener('resize', () => { setCanvasSize(); });

                    // サムネ load 後の IMAGES 行拡張やパネル折畳みで
                    // #image-viewer 自体のサイズが変わった場合も再計算する
                    if (typeof ResizeObserver !== 'undefined') {
                        let rafId = 0;
                        const ro = new ResizeObserver(() => {
                            if (rafId) cancelAnimationFrame(rafId);
                            rafId = requestAnimationFrame(() => { rafId = 0; setCanvasSize(); });
                        });
                        ro.observe(document.getElementById('image-viewer'));
                    }
                }
            }
        }

        // 現在チェックされているレイヤ一覧
        function checkedLayerKeys() {
            return Array.from(document.querySelectorAll('#image-selector-options input.layer-check:checked'))
                .map(cb => cb.value);
        }

        // 表示状態をプロジェクトに書き戻す (静的データセットのときは何もしない)
        function persistVisibleLayers() {
            if (!currentProject) return;
            currentProject.visibleLayers = checkedLayerKeys();
            queueSaveProject();
        }
        function persistLayerDisplay() {
            if (!currentProject) return;
            currentProject.layerDisplay = currentProject.layerDisplay || {};
            for (const key of Object.keys(imageSettings)) {
                const s = imageSettings[key];
                currentProject.layerDisplay[key] = {
                    vmin: s.vmin, vmax: s.vmax, opacity: s.opacity, applyOpacity: s.applyOpacity !== false,
                };
            }
            queueSaveProject();
        }
        // ROI はビューア側で atlasData.roi を直接いじるので、変更のたびに
        // プロジェクトへ書き戻す。
        // ★ 以前は書き戻しが無く、opacity 変更などの「ついでの保存」でしか
        //   永続化されなかった (描いてリロードすると消えることがあった)。
        function persistRoi() {
            if (!currentProject) return;
            currentProject.roi = atlasData.roi;
            queueSaveProject();
        }

        let saveTimer = 0;
        function queueSaveProject() {
            if (!currentProject) return;
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveTimer = 0;
                ProjectStorage.putProject(currentProject).catch(e => console.warn('[save] 失敗', e));
            }, 400);
        }

        // 大津法: このレイヤに適用する keep マスク (トグル OFF なら null)
        function otsuKeepFor(key) {
            if (!otsuState.applied || !otsuState.record) return null;
            const vr = valueRasters[key];
            if (!vr) return null;
            const rec = otsuState.record;
            if (rec.W !== vr.W || rec.H !== vr.H) return null;
            return rec.keep;
        }

        function renderCompositeImage() {
            if (isRendering || !displayCtx) return;
            isRendering = true;
            // ★ try/finally が無いと、描画中の例外でフラグが立ちっぱなしになり、
            //   以後すべての再描画が黙って無視される (操作が一切効かなくなる)。
            try {
            
            // HE/IF を先に、MSI を後に描く。こうしておくと MSI の透明度が
            // 「100% で HE を覆い、0% で HE が見える」という直感どおりに働く。
            const keysToRender = checkedLayerKeys().sort((a, b) => {
                const am = /^MSI/i.test(a) ? 1 : 0, bm = /^MSI/i.test(b) ? 1 : 0;
                return am - bm;
            });

            displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);

            for (const key of keysToRender) {
                const settings = imageSettings[key];
                const sourceImg = imageSources[key];
                const vr = valueRasters[key];
                if (!vr && (!sourceImg || !sourceImg.complete || sourceImg.naturalWidth === 0)) continue;

                let tempCanvas;
                if (vr) {
                    // 生値ラスタから直接着色する。8bit を経由しないので、生単位の
                    // 強度ウィンドウがそのまま効き、大津法のマスクも適用できる。
                    tempCanvas = MSIRaster.paintRasterToCanvas(vr.values, vr.W, vr.H, {
                        color: getMsiColor(key),
                        win: { min: settings.vmin, max: settings.vmax },
                        gamma: 0.5,
                        keep: otsuKeepFor(key),
                    });
                } else {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = sourceImg.naturalWidth;
                tempCanvas.height = sourceImg.naturalHeight;
                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                tempCtx.drawImage(sourceImg, 0, 0);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imageData.data;
                const { vmin, vmax } = settings;
                const range = vmax - vmin;
                const msiColor = getMsiColor(key);

                if (range > 0) {
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const normalized = Math.max(0, Math.min(1, (lum - vmin) / range));

                        if (msiColor) {
                            // MSI画像: 単色グラデーション（色 × 強度）
                            if (a === 0 || (lum < 1 && normalized < 0.01)) {
                                // 透明またはほぼゼロ → 透明のまま
                                data[i] = 0; data[i+1] = 0; data[i+2] = 0; data[i+3] = 0;
                            } else {
                                // サムネイルと同じ γ=0.5 でミッドトーンを持ち上げ、弱信号の脳辺縁を可視化
                                const bright = Math.pow(normalized, 0.5);
                                data[i]   = Math.min(255, Math.round(msiColor[0] * bright));
                                data[i+1] = Math.min(255, Math.round(msiColor[1] * bright));
                                data[i+2] = Math.min(255, Math.round(msiColor[2] * bright));
                                data[i+3] = 255;
                            }
                        } else {
                            // HE/IF画像: 従来のグレースケール輝度正規化
                            const targetLum = normalized * 255;
                            if (lum < 1) {
                                const v = Math.round(targetLum);
                                data[i] = v; data[i+1] = v; data[i+2] = v;
                            } else {
                                const scale = targetLum / lum;
                                data[i]   = Math.min(255, Math.max(0, Math.round(r * scale)));
                                data[i+1] = Math.min(255, Math.max(0, Math.round(g * scale)));
                                data[i+2] = Math.min(255, Math.max(0, Math.round(b * scale)));
                            }
                        }
                    }
                }
                tempCtx.putImageData(imageData, 0, 0);
                }

                displayCtx.globalAlpha = settings.applyOpacity === false ? 1.0 : settings.opacity;
                // MSI画像は加算合成（lighter）で重ねる → 複数MSIの色が混ざって見える
                const isMsiLayer = /^MSI/i.test(key);
                const isHeLike   = /HE_STAIN|IF_STAIN/i.test(key);
                displayCtx.globalCompositeOperation = isMsiLayer ? 'lighter' : 'source-over';

                const T = atlasData.world_coords && atlasData.world_coords.T_he_to_msi;
                const isPortrait = sourceImg ? sourceImg.naturalHeight > sourceImg.naturalWidth
                                             : tempCanvas.height > tempCanvas.width;
                const msiRef = getMsiRefSize();

                // ★ 以前は portrait の HE にしか T を適用していなかったが、それだと
                //   横長の HE を登録して重ね合わせを実行しても、保存はされるのに
                //   画面が一切変わらない (landscape フォールバックで引き伸ばされる)。
                //   T があるなら向きに関係なく適用する。
                if (T && isHeLike && msiRef && msiRef.w > 0 && msiRef.h > 0) {
                    // HE/IF を T_he_to_msi で MSI 座標系へ変換してから CCW90° でキャンバスに描画
                    displayCtx.save();
                    displayCtx.translate(0, displayCanvas.height);
                    displayCtx.rotate(-Math.PI / 2);
                    // 現在の local frame は MSI ピクセル空間。キャンバス内部解像度に合わせてスケール
                    displayCtx.scale(displayCanvas.height / msiRef.w, displayCanvas.width / msiRef.h);
                    // T_he_to_msi を適用:local frame が HE ピクセル空間になる
                    displayCtx.transform(T[0][0], T[1][0], T[0][1], T[1][1], T[0][2], T[1][2]);
                    displayCtx.drawImage(tempCanvas, 0, 0);
                    displayCtx.restore();
                } else if (isMsiLayer) {
                    // MSI portrait → CCW90° 回転でキャンバス全面にフィット
                    displayCtx.save();
                    displayCtx.translate(0, displayCanvas.height);
                    displayCtx.rotate(-Math.PI / 2);
                    displayCtx.drawImage(tempCanvas, 0, 0, displayCanvas.height, displayCanvas.width);
                    displayCtx.restore();
                } else {
                    // フォールバック(test1 互換): 従来の landscape/portrait 自動判定
                    const isLandscape = !isPortrait;
                    if (isLandscape) {
                        displayCtx.drawImage(tempCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
                    } else {
                        displayCtx.save();
                        displayCtx.translate(0, displayCanvas.height);
                        displayCtx.rotate(-Math.PI / 2);
                        displayCtx.drawImage(tempCanvas, 0, 0, displayCanvas.height, displayCanvas.width);
                        displayCtx.restore();
                    }
                }
            }

            displayCtx.globalCompositeOperation = 'source-over';
            displayCtx.globalAlpha = 1.0;
            } finally {
                isRendering = false;
            }
        }

        function populateThumbnails() {
            const container = document.getElementById('thumbnail-container');
            container.innerHTML = ''; 

            const allKeys = atlasData.images ? Object.keys(atlasData.images) : [];
            const heKeys = allKeys.filter(k => k.toUpperCase().includes('HE_STAIN'));
            const ifKeys = allKeys.filter(k => k.toUpperCase().includes('IF_STAIN'));
            const rawMsi = allKeys.filter(k => k.toUpperCase().includes('MSI_'));
            const orderSpec = Array.isArray(atlasData.thumbnail_order) ? atlasData.thumbnail_order : [];
            const orderSet = new Set(orderSpec);
            const ordered = orderSpec.filter(k => rawMsi.includes(k));
            const rest = rawMsi.filter(k => !orderSet.has(k)).sort();
            const msiKeys = ordered.concat(rest);

            // 実画像のみ残す。 "No Image" placeholder はユーザー要件により描画しない。
            const rawSlots = [
                heKeys[0] || null, ifKeys[0] || null, ifKeys[1] || null, ifKeys[2] || null,
                msiKeys[0] || null, msiKeys[1] || null, msiKeys[2] || null, msiKeys[3] || null
            ];
            const slots = rawSlots.filter(key => key && atlasData.images[key]);

            if (slots.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-xs">No images found.</p>';
                return;
            }

            // 横 1 列に収まるよう、セル幅をおおよそ均等割りする (flex-basis を計算)。
            // 実画像数が少ないほど 1 枚が大きくなる。max-height は .thumb-rot-box 側で 170px に抑える。
            const cellBasis = `calc(${(100 / slots.length).toFixed(4)}% - 4px)`;

            slots.forEach((key, index) => {
                const slotWrapper = document.createElement('div');
                slotWrapper.className = 'flex flex-col group items-stretch overflow-visible relative';
                slotWrapper.style.flex = `0 0 ${cellBasis}`;
                slotWrapper.style.maxWidth = cellBasis;
                slotWrapper.dataset.slotNumber = index + 1;

                // 回転ラッパ。MSI だけ CSS で −180° 回転。aspect は --rot-ar = iw/ih。
                const rotBox = document.createElement('div');
                rotBox.className = 'thumb-rot-box';

                const thumb = document.createElement('img');
                const src = atlasData.images[key];
                thumb.src = src;
                thumb.alt = formatDisplayName(key);
                thumb.className = 'thumbnail';
                thumb.dataset.key = key;
                thumb.onclick = () => setActiveImage(key);

                if (key.toUpperCase().includes('HE_STAIN') || key.toUpperCase().includes('IF_STAIN')) {
                  thumb.classList.add('heif-thumb');
                }

                const applyRotAr = () => {
                    const iw = thumb.naturalWidth;
                    const ih = thumb.naturalHeight;
                    if (!iw || !ih) return;
                    rotBox.style.setProperty('--rot-ar', `${iw} / ${ih}`);
                };
                if (thumb.complete && thumb.naturalWidth > 0) applyRotAr();
                else thumb.addEventListener('load', applyRotAr, { once: true });

                if (key.startsWith('MSI_')) {
                  msiThumbRefs.set(key, thumb);
                  const runOnce = () => {
                      thumb.removeEventListener('load', runOnce);
                      renderMsiThumbnail(key, thumb);
                  };
                  if (thumb.complete && thumb.naturalWidth > 0) {
                      renderMsiThumbnail(key, thumb);
                  } else {
                      thumb.addEventListener('load', runOnce);
                  }
                }
                rotBox.appendChild(thumb);
                slotWrapper.appendChild(rotBox);

                const titleOverlay = document.createElement('div');
                titleOverlay.className = 'w-full px-2 py-1 bg-gray-700 text-white text-xs text-center rounded flex items-center justify-center gap-1';
                const msiCol = getMsiColor(key);
                if (msiCol) {
                    const dot = document.createElement('span');
                    dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:rgb(${msiCol.join(',')});flex-shrink:0;`;
                    titleOverlay.appendChild(dot);
                }
                const titleText = document.createElement('span');
                titleText.textContent = formatDisplayName(key);
                titleOverlay.appendChild(titleText);
                slotWrapper.appendChild(titleOverlay);

                container.appendChild(slotWrapper);
            });
        }

        function setActiveImage(imageKey) {
            const checkbox = document.querySelector(
                `#image-selector-options input.layer-check[value="${CSS.escape(imageKey)}"]`);
            if (checkbox) {
                checkbox.checked = !checkbox.checked;
                renderCompositeImage();
                persistVisibleLayers();
                if (checkbox.checked) {
                    focusThumbnail(imageKey); // <<< added: サムネイル側も同期
                } else {
                    const remain = document.querySelector('#image-selector-options input.layer-check:checked');
                    if (remain) focusThumbnail(remain.value);
                    else {
                        const thumbs = document.querySelectorAll('#thumbnail-container img.thumbnail');
                        thumbs.forEach(t => t.classList.remove('active'));
                    }
                }
            }
        }

            roiList.innerHTML = '';
            const roiItems = (atlasData.roi && atlasData.roi.roi_items) ? atlasData.roi.roi_items : {};
            const roiNames = (atlasData.roi && atlasData.roi.roi_names) ? atlasData.roi.roi_names : {};
            const palette  = (atlasData.roi && atlasData.roi.palette)   ? atlasData.roi.palette   : {};
            atlasData.roi = atlasData.roi || {};
            atlasData.roi.roi_show_flags = atlasData.roi.roi_show_flags || {};
            const showFlags = atlasData.roi.roi_show_flags;

            Object.keys(roiItems).forEach(key => {
                const name = roiNames[key] || key;
                const rgba = palette[key]  || [128,128,128,255];
                const isUser = typeof key === 'string' && key.startsWith(USER_ROI_PREFIX);
                if (showFlags[key] === undefined) showFlags[key] = true;

                const el = document.createElement('div');
                el.className = 'roi-item p-2 rounded-md flex items-center justify-between border-l-4 border-transparent';
                el.dataset.roiKey = key;

                const label = document.createElement('div');
                label.className = 'flex items-center min-w-0 flex-1';

                // 表示 ON/OFF チェックボックス(全 ROI 共通)
                const showChk = document.createElement('input');
                showChk.type = 'checkbox';
                showChk.className = 'mr-1 accent-blue-600 cursor-pointer flex-none';
                showChk.checked = showFlags[key] !== false;
                showChk.title = '表示 ON/OFF（クリックでトグル）';
                showChk.addEventListener('click', (e) => e.stopPropagation());
                showChk.addEventListener('change', () => {
                    showFlags[key] = showChk.checked;
                    persistRoi();
                    const activeKey = document.querySelector('.roi-item.active')?.dataset.roiKey || null;
                    drawAllRois(activeKey);
                    displayGraphForRoi(activeKey);
                });
                label.appendChild(showChk);

                const swatch = document.createElement('span');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = `rgba(${rgba[0]},${rgba[1]},${rgba[2]},${rgba[3]/255})`;
                label.appendChild(swatch);

                const nameSpan = document.createElement('span');
                nameSpan.className = 'truncate';
                nameSpan.textContent = name;
                let pencil = null;
                if (isUser) {
                    // user ROI だけ名前クリックで改名できる
                    nameSpan.classList.add('cursor-pointer', 'hover:underline');
                    nameSpan.title = 'クリックで名前を変更';
                    nameSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const current = atlasData.roi.roi_names[key] || key;
                        const next = (prompt('ROI 名を入力してください', current) || '').trim();
                        if (!next || next === current) return;
                        atlasData.roi.roi_names[key] = next;
                        persistRoi();
                        populateRoiList();
                        const prev = document.querySelector(`.roi-item[data-roi-key="${CSS.escape(key)}"]`);
                        if (prev) {
                            document.querySelectorAll('.roi-item').forEach(i => i.classList.remove('active'));
                            prev.classList.add('active');
                        }
                        drawAllRois(key);
                        displayGraphForRoi(key);
                    });
                    pencil = document.createElement('span');
                    pencil.textContent = ' ✎';
                    pencil.className = 'ml-1 text-slate-400 hover:text-slate-700 cursor-pointer flex-none';
                    pencil.title = 'クリックで名前を変更';
                    pencil.addEventListener('click', (e) => {
                        e.stopPropagation();
                        nameSpan.click();
                    });
                }
                label.appendChild(nameSpan);
                if (pencil) label.appendChild(pencil);

                el.appendChild(label);

                if (isUser) {
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'ml-2 text-xs text-gray-400 hover:text-red-600';
                    delBtn.title = 'Delete user ROI';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteUserRoi(key);
                    });
                    el.appendChild(delBtn);
                }

                el.addEventListener('click', () => {
                    displayGraphForRoi(key);
                    drawAllRois(key);
                    document.querySelectorAll('.roi-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');

                roiList.appendChild(el);

            // ROI表示トグル(全体マスター)
            const roiToggle = document.getElementById('roi-toggle');
            if (roiToggle && !roiToggle.dataset.bound) {
                roiToggle.dataset.bound = '1';
                roiToggle.addEventListener('change', () => {
                    const activeRoi = document.querySelector('.roi-item.active');
                    drawAllRois(activeRoi ? activeRoi.dataset.roiKey : null);
                });
            }
        }
        
        // MSI座標系のサイズを取得（最初のMSIラスタ/画像から推定）
        function getMsiRefSize() {
            const rasterKeys = Object.keys(valueRasters);
            if (rasterKeys.length > 0) {
                const vr = valueRasters[rasterKeys[0]];
                if (vr && vr.W > 0) return { w: vr.W, h: vr.H };
            }
            const msiKeys = Object.keys(imageSources).filter(k => /^MSI/i.test(k));
            if (msiKeys.length > 0) {
                const ref = imageSources[msiKeys[0]];
                if (ref && ref.naturalWidth > 0) return { w: ref.naturalWidth, h: ref.naturalHeight };
            }
            // フォールバック: ROI座標の最大値から推定
            return { w: roiCanvas.width, h: roiCanvas.height };
        }

        function drawAllRois(highlightKey = null) {
            if (!roiCtx || roiCanvas.width === 0) return;

            roiCtx.clearRect(0, 0, roiCanvas.width, roiCanvas.height);

            // ROIトグルがOFFなら描画しない
            const roiToggle = document.getElementById('roi-toggle');
            if (roiToggle && !roiToggle.checked) return;

            const roiItems = (atlasData.roi && atlasData.roi.roi_items) ? atlasData.roi.roi_items : {};
            const palette = (atlasData.roi && atlasData.roi.palette) ? atlasData.roi.palette : {};
            const showFlags = (atlasData.roi && atlasData.roi.roi_show_flags) || {};

            // MSI座標(縦長)をCCW90°回転して横長キャンバスにマッピング
            // MSI(mx,my) → portrait(mx*sX, my*sY) → CCW90°→ landscape(my*sY2, canvasH - mx*sX2)
            const msiRef = getMsiRefSize();
            const sxFactor = roiCanvas.height / msiRef.w;  // MSI-x → canvas-y方向
            const syFactor = roiCanvas.width  / msiRef.h;  // MSI-y → canvas-x方向

            // キャンバス内部解像度 → CSS 表示サイズ比から、CSS 1px 相当の線幅を算出
            const cssW = roiCanvas.offsetWidth || roiCanvas.width;
            const pxPerCss = roiCanvas.width / Math.max(1, cssW);

            Object.keys(roiItems).forEach(roiKey => {
                if (showFlags[roiKey] === false) return;
                const isHighlight = roiKey === highlightKey;
                const rgba = palette[roiKey];
                if (!roiItems[roiKey] || !roiItems[roiKey][0] || !roiItems[roiKey][0].poly_msi || !rgba) return;

                const poly = roiItems[roiKey][0].poly_msi;

                roiCtx.beginPath();
                if (poly.length > 0) {
                    const cx = poly[0][1] * syFactor;
                    const cy = roiCanvas.height - poly[0][0] * sxFactor;
                    roiCtx.moveTo(cx, cy);
                }
                for (let i = 1; i < poly.length; i++) {
                    const cx = poly[i][1] * syFactor;
                    const cy = roiCanvas.height - poly[i][0] * sxFactor;
                    roiCtx.lineTo(cx, cy);
                }
                roiCtx.closePath();

                roiCtx.strokeStyle = `rgba(${rgba[0]}, ${rgba[1]}, ${rgba[2]}, 0.95)`;
                // CSS 表示で 1〜2px になるよう内部座標の lineWidth を計算
                roiCtx.lineWidth = (isHighlight ? 2.0 : 1.0) * pxPerCss;
                roiCtx.stroke();
            });
        }

        function setupGraphSelector() {
            const select1 = document.getElementById('graph-select-1');
            const select2 = document.getElementById('graph-select-2');
            const select3 = document.getElementById('graph-select-3');
            // 実際に読み込まれている画像レイヤから作る。
            // (以前はスタブの graphData から作っていたため、登録データや MSI_TIC が選べなかった)
            const allKeys = Object.keys(atlasData.images || {});
            const graphKeys = allKeys.filter(k => /^MSI_/i.test(k));
            if (!graphKeys.length) graphKeys.push.apply(graphKeys, allKeys);

            [select1, select2, select3].forEach(s => s.innerHTML = '');

            graphKeys.forEach(key => select1.add(new Option(formatDisplayName(key), key)));
            select2.add(new Option('-', 'none'));
            graphKeys.forEach(key => select2.add(new Option(formatDisplayName(key), key)));
            select3.add(new Option('-', 'none'));
            graphKeys.forEach(key => select3.add(new Option(formatDisplayName(key), key)));

            const msiKeys = graphKeys.filter(k => k.startsWith('MSI_'));
            if (msiKeys.length >= 1) select1.value = msiKeys[0];
            if (msiKeys.length >= 2) select2.value = msiKeys[1];
            if (msiKeys.length >= 3) select3.value = msiKeys[2];

            const updateGraph = () => {
                const activeRoi = document.querySelector('.roi-item.active');
                if (activeRoi) displayGraphForRoi(activeRoi.dataset.roiKey);
            };

            select1.addEventListener('change', updateGraph);
            select2.addEventListener('change', updateGraph);
            select3.addEventListener('change', updateGraph);
        }

        /**
         * ROI内のMSIピクセル強度を抽出する
         * poly_msi座標はMSI画像のピクセル空間（portrait）上の座標
         */
        function extractRoiPixels(imageKey, roiKey) {
            const polys = atlasData.roi?.roi_items?.[roiKey];
            if (!polys || polys.length === 0) return [];

            // 生値ラスタがあるなら 8bit の輝度ではなく生の強度を返す。
            // ROI 統計は定量値なので、表示用の量子化を通してはいけない。
            const vr = valueRasters[imageKey];
            if (vr) {
                const keep = otsuKeepFor(imageKey);
                const out = [];
                for (const poly of polys) {
                    if (!Array.isArray(poly.poly_msi)) continue;
                    if (!keep) {
                        out.push.apply(out, MSIRaster.extractRoiValues(vr.values, vr.W, vr.H, poly.poly_msi));
                        continue;
                    }
                    // 背景除去が有効なときは、除去済み画素を統計から外した配列を作る
                    const masked = new Float32Array(vr.values.length);
                    for (let i = 0; i < masked.length; i++) masked[i] = keep[i] ? vr.values[i] : NaN;
                    out.push.apply(out, MSIRaster.extractRoiValues(masked, vr.W, vr.H, poly.poly_msi));
                }
                return out;
            }

            const sourceImg = imageSources[imageKey];
            if (!sourceImg || !sourceImg.complete || sourceImg.naturalWidth === 0) return [];

            const iw = sourceImg.naturalWidth;
            const ih = sourceImg.naturalHeight;
            const tc = document.createElement('canvas');
            tc.width = iw; tc.height = ih;
            const tctx = tc.getContext('2d', { willReadFrequently: true });
            tctx.drawImage(sourceImg, 0, 0);
            const imgData = tctx.getImageData(0, 0, iw, ih);
            const data = imgData.data;

            // ROIポリゴン内判定（poly_msi座標 = MSI画像ピクセル座標）
            const values = [];
            for (const poly of polys) {
                if (!Array.isArray(poly.poly_msi)) continue;
                const vertices = poly.poly_msi;
                // バウンディングボックス
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const [mx, my] of vertices) {
                    if (mx < minX) minX = mx; if (mx > maxX) maxX = mx;
                    if (my < minY) minY = my; if (my > maxY) maxY = my;
                }
                const x0 = Math.max(0, Math.floor(minX));
                const x1 = Math.min(iw - 1, Math.ceil(maxX));
                const y0 = Math.max(0, Math.floor(minY));
                const y1 = Math.min(ih - 1, Math.ceil(maxY));

                for (let py = y0; py <= y1; py++) {
                    for (let px = x0; px <= x1; px++) {
                        if (pointInPolygon(px, py, vertices)) {
                            const idx = (py * iw + px) * 4;
                            if (data[idx + 3] === 0) continue; // 透明ピクセル除外
                            const lum = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                            values.push(lum);
                        }
                    }
                }
            }
            return values;
        }

        // レイキャスト法による点のポリゴン内判定
        function pointInPolygon(x, y, vertices) {
            let inside = false;
            for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {
                const xi = vertices[i][0], yi = vertices[i][1];
                const xj = vertices[j][0], yj = vertices[j][1];
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        /** 平均と標準偏差を計算 */
        function calcStats(arr) {
            if (arr.length === 0) return { mean: 0, sd: 0, n: 0 };
            const n = arr.length;
            const mean = arr.reduce((s, v) => s + v, 0) / n;
            const variance = arr.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
            return { mean, sd: Math.sqrt(variance), n };
        }

        function displayGraphForRoi(highlightRoiKey) {
            const graphContainer = document.getElementById('graph-container');
            const select1Val = document.getElementById('graph-select-1').value;
            const select2Val = document.getElementById('graph-select-2').value;
            const select3Val = document.getElementById('graph-select-3').value;

            // Canvasを用意
            let graphCanvas = document.getElementById('graph-canvas');
            const graphImage = document.getElementById('graph-image');
            if (!graphCanvas) {
                graphCanvas = document.createElement('canvas');
                graphCanvas.id = 'graph-canvas';
                graphCanvas.className = 'w-full h-auto';
                graphCanvas.style.maxHeight = '450px';
                graphContainer.innerHTML = '';
                graphContainer.appendChild(graphCanvas);
            }
            if (graphImage) graphImage.style.display = 'none';

            // 全ROIのキーとパレットを取得(表示 OFF の ROI はグラフから除外)
            const roiItems = atlasData.roi?.roi_items || {};
            const roiNames = atlasData.roi?.roi_names || {};
            const palette = atlasData.roi?.palette || {};
            const showFlags = atlasData.roi?.roi_show_flags || {};
            const roiKeys = Object.keys(roiItems).filter(k => showFlags[k] !== false);

            if (roiKeys.length === 0) {
                // 表示中 ROI が無いときはグラフを空にリセット
                const ctx = graphCanvas.getContext('2d');
                graphCanvas.width = graphCanvas.clientWidth || 400;
                graphCanvas.height = graphCanvas.clientHeight || 200;
                ctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
                ctx.fillStyle = '#fafafa';
                ctx.fillRect(0, 0, graphCanvas.width, graphCanvas.height);
                ctx.fillStyle = '#888';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('表示中の ROI がありません', graphCanvas.width / 2, graphCanvas.height / 2);
                return;
            }

            // 選択されたチャネルを収集（重複除外）
            const channels = [select1Val];
            if (select2Val !== 'none' && !channels.includes(select2Val)) channels.push(select2Val);
            if (select3Val !== 'none' && !channels.includes(select3Val)) channels.push(select3Val);

            // 各チャネル×全ROIの統計を計算
            const allStats = {};
            for (const ch of channels) {
                allStats[ch] = {};
                for (const rk of roiKeys) {
                    allStats[ch][rk] = calcStats(extractRoiPixels(ch, rk));
                }
            }

            if (channels.length === 1) {
                drawBarChart(graphCanvas, roiKeys, roiNames, palette, allStats[channels[0]], channels[0], highlightRoiKey);
            } else {
                drawMultiBarChart(graphCanvas, roiKeys, roiNames, palette, allStats, channels, highlightRoiKey);
            }
        }

        function drawBarChart(canvas, roiKeys, roiNames, palette, statsPerRoi, imageKey, highlightRoiKey) {
            const nBars = roiKeys.length;
            const container = document.getElementById('graph-container');
            const cw = container ? container.clientWidth : 500;
            const ch = container ? container.clientHeight : 400;
            const W = Math.max(cw, nBars * 40 + 80), H = Math.max(ch, 200);
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);

            const margin = { top: 45, right: 30, bottom: 100, left: 75 };
            const pw = W - margin.left - margin.right;
            const ph = H - margin.top - margin.bottom;

            // Y軸の最大値（meanの最大）
            let yMax = 0;
            for (const rk of roiKeys) {
                const s = statsPerRoi[rk];
                yMax = Math.max(yMax, s.mean);
            }
            if (yMax === 0) yMax = 1;
            yMax *= 1.15; // 余白

            const barW = pw / nBars;
            const barPad = barW * 0.2;

            // グリッド線
            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            const nTicks = 5;
            for (let i = 1; i <= nTicks; i++) {
                const y = H - margin.bottom - (i / nTicks) * ph;
                ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(W - margin.right, y); ctx.stroke();
            }

            // 軸
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, H - margin.bottom);
            ctx.lineTo(W - margin.right, H - margin.bottom);
            ctx.stroke();

            // MSI色を取得
            const msiColor = getMsiColor(imageKey);

            // バー描画
            for (let i = 0; i < nBars; i++) {
                const rk = roiKeys[i];
                const s = statsPerRoi[rk];
                const rgba = palette[rk] || [150, 150, 150, 255];
                const isHighlight = (rk === highlightRoiKey);

                // バーの色: ROIパレット色をベースに、MSI色があればそちらを使い、ROI色は枠線に
                let fillColor, strokeColor;
                if (msiColor) {
                    const alpha = isHighlight ? 0.9 : 0.65;
                    fillColor = `rgba(${msiColor[0]},${msiColor[1]},${msiColor[2]},${alpha})`;
                    strokeColor = `rgba(${rgba[0]},${rgba[1]},${rgba[2]},1)`;
                } else {
                    const alpha = isHighlight ? 0.9 : 0.65;
                    fillColor = `rgba(${rgba[0]},${rgba[1]},${rgba[2]},${alpha})`;
                    strokeColor = `rgb(${Math.max(0,rgba[0]-40)},${Math.max(0,rgba[1]-40)},${Math.max(0,rgba[2]-40)})`;
                }

                const barH = (s.mean / yMax) * ph;
                const x = margin.left + i * barW + barPad;
                const bw = barW - barPad * 2;
                const y = H - margin.bottom - barH;

                ctx.fillStyle = fillColor;
                ctx.fillRect(x, y, bw, barH);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = isHighlight ? 2.5 : 1;
                ctx.strokeRect(x, y, bw, barH);

                // X軸ラベル（ROI名） - 45°回転で長名でも隣と重ならないように描画
                const cx = x + bw / 2;
                ctx.fillStyle = isHighlight ? '#000' : '#444';
                ctx.font = isHighlight ? 'bold 14px sans-serif' : '13px sans-serif';
                const name = roiNames[rk] || rk;
                ctx.save();
                ctx.translate(cx, H - margin.bottom + 10);
                ctx.rotate(-Math.PI / 4);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, 0, 0);
                ctx.restore();
            }

            // Y軸ラベル
            ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
            for (let i = 0; i <= nTicks; i++) {
                const v = (i / nTicks) * yMax;
                const y = H - margin.bottom - (i / nTicks) * ph;
                ctx.fillText(formatAxisValue(v), margin.left - 8, y + 4);
            }
            ctx.save(); ctx.translate(18, H / 2); ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center'; ctx.font = '12px sans-serif';
            ctx.fillText('Mean Intensity', 0, 0); ctx.restore();

            // タイトル
            ctx.fillStyle = '#222'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${formatDisplayName(imageKey)} — ROI Mean Intensity`, W / 2, 26);
        }

        function drawMultiBarChart(canvas, roiKeys, roiNames, palette, allStats, channels, highlightRoiKey) {
            const nRoi = roiKeys.length;
            const nCh = channels.length;
            const container = document.getElementById('graph-container');
            const cw = container ? container.clientWidth : 550;
            const ch = container ? container.clientHeight : 420;
            const W = Math.max(cw, nRoi * (nCh * 16 + 20) + 100), H = Math.max(ch, 200);
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);

            const margin = { top: 50, right: 30, bottom: 110, left: 75 };
            const pw = W - margin.left - margin.right;
            const ph = H - margin.top - margin.bottom;

            // Y軸最大値
            let yMax = 0;
            for (const ch of channels) {
                for (const rk of roiKeys) {
                    yMax = Math.max(yMax, allStats[ch][rk].mean);
                }
            }
            if (yMax === 0) yMax = 1;
            yMax *= 1.15;

            const groupW = pw / nRoi;
            const padRatio = 0.1;
            const innerW = groupW * (1 - 2 * padRatio);
            const barW = innerW / nCh - 2;
            const gap = 2;

            // グリッド線
            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            const nTicks = 5;
            for (let i = 1; i <= nTicks; i++) {
                const y = H - margin.bottom - (i / nTicks) * ph;
                ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(W - margin.right, y); ctx.stroke();
            }

            // 軸
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, H - margin.bottom);
            ctx.lineTo(W - margin.right, H - margin.bottom);
            ctx.stroke();

            // チャネルごとの色
            const chColors = channels.map(ch => getMsiColor(ch) || [100, 100, 200]);

            for (let ri = 0; ri < nRoi; ri++) {
                const rk = roiKeys[ri];
                const isHighlight = (rk === highlightRoiKey);
                const rgba = palette[rk] || [150, 150, 150, 255];
                const gx = margin.left + ri * groupW + groupW * padRatio;

                for (let ci = 0; ci < nCh; ci++) {
                    const ch = channels[ci];
                    const s = allStats[ch][rk];
                    const color = chColors[ci];
                    const alpha = isHighlight ? 0.9 : 0.6;
                    const bx = gx + ci * (barW + gap);
                    const barH = (s.mean / yMax) * ph;
                    const by = H - margin.bottom - barH;

                    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
                    ctx.fillRect(bx, by, barW, barH);
                    // 枠線はROIの色
                    ctx.strokeStyle = `rgb(${rgba[0]},${rgba[1]},${rgba[2]})`;
                    ctx.lineWidth = isHighlight ? 2.5 : 1.5;
                    ctx.strokeRect(bx, by, barW, barH);
                }

                // X軸ラベル - 45°回転で長名でも隣と重ならないように描画
                const cx = margin.left + ri * groupW + groupW / 2;
                const name = roiNames[rk] || rk;
                ctx.fillStyle = isHighlight ? '#000' : '#444';
                ctx.font = isHighlight ? 'bold 14px sans-serif' : '13px sans-serif';
                ctx.save();
                ctx.translate(cx, H - margin.bottom + 10);
                ctx.rotate(-Math.PI / 4);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, 0, 0);
                ctx.restore();
            }

            // Y軸ラベル
            ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
            for (let i = 0; i <= nTicks; i++) {
                const v = (i / nTicks) * yMax;
                const y = H - margin.bottom - (i / nTicks) * ph;
                ctx.fillText(formatAxisValue(v), margin.left - 8, y + 4);
            }
            ctx.save(); ctx.translate(18, H / 2); ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center'; ctx.font = '12px sans-serif';
            ctx.fillText('Mean Intensity', 0, 0); ctx.restore();

            // 凡例（中央揃え）
            const legY = 10;
            const legItemW = 110;
            const legTotalW = nCh * legItemW;
            const legStartX = (W - legTotalW) / 2;
            for (let ci = 0; ci < nCh; ci++) {
                const color = chColors[ci];
                const lx = legStartX + ci * legItemW;
                ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
                ctx.fillRect(lx, legY, 14, 14);
                ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(formatDisplayName(channels[ci]), lx + 18, legY + 12);
            }

            // タイトル
            const title = channels.map(ch => formatDisplayName(ch)).join(' vs ');
            ctx.fillStyle = '#222'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${title} — ROI Mean Intensity`, W / 2, 40);
        }

        /** Y軸の値をフォーマット（大きい値は科学表記） */
        function formatAxisValue(v) {
            if (v === 0) return '0';
            if (v >= 1e6) return v.toExponential(1);
            if (v >= 1000) return Math.round(v).toLocaleString();
            if (v >= 1) return v.toFixed(1);
            return v.toFixed(2);
        }
        
        function setupCollapsibleSections() {
            const setupToggle = (toggleId, contentId, iconId) => {
                const toggleEl = document.getElementById(toggleId);
                const contentEl = document.getElementById(contentId);
                const iconEl = document.getElementById(iconId);
                
                if (toggleEl && contentEl && iconEl) {
                    contentEl.classList.remove('hidden');
                    iconEl.classList.add('rotate-180');
                    toggleEl.addEventListener('click', () => {
                        contentEl.classList.toggle('hidden');
                        iconEl.classList.toggle('rotate-180');
                    });
                }
            };

            setupToggle('toggle-image-selection', 'thumbnail-container', 'icon-image-selection');
            setupToggle('toggle-analysis-graph', 'analysis-graph-content', 'icon-analysis-graph');
        }

        // =======================================================================
        // ユーザー描画 ROI 機能
        // =======================================================================

        function pickUnusedPaletteColor() {
            const palette = (atlasData.roi && atlasData.roi.palette) || {};
            const items   = (atlasData.roi && atlasData.roi.roi_items) || {};
            // 既に ROI 本体が存在するキーに割り当てられている RGBA を「使用済み」として集める。
            // これにより、atlas.json に残った空の palette 枠(Cyan 等)を 1 つずつ順番に消費できる。
            const usedRgba = new Set();
            for (const key of Object.keys(items)) {
                const rgba = palette[key];
                if (Array.isArray(rgba)) usedRgba.add(rgba.join(','));
            }
            for (const [name, rgba] of Object.entries(palette)) {
                if (!Array.isArray(rgba)) continue;
                if (usedRgba.has(rgba.join(','))) continue;
                return rgba.slice();
            }
            // フォールバック: ランダム彩度高め
            const h = Math.floor(Math.random() * 360);
            const rgb = (() => {
                const s = 0.75, l = 0.55;
                const c = (1 - Math.abs(2*l - 1)) * s;
                const hp = h / 60;
                const x = c * (1 - Math.abs(hp % 2 - 1));
                let r=0,g=0,b=0;
                if      (hp < 1) { r=c; g=x; }
                else if (hp < 2) { r=x; g=c; }
                else if (hp < 3) { g=c; b=x; }
                else if (hp < 4) { g=x; b=c; }
                else if (hp < 5) { r=x; b=c; }
                else             { r=c; b=x; }
                const m = l - c/2;
                return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
            })();
            return [rgb[0], rgb[1], rgb[2], 255];
        }

        function canvasToMsi(canvasX, canvasY) {
            const msiRef = getMsiRefSize();
            const sxFactor = roiCanvas.height / msiRef.w;
            const syFactor = roiCanvas.width  / msiRef.h;
            const mx = (roiCanvas.height - canvasY) / sxFactor;
            const my = canvasX / syFactor;
            return [mx, my];
        }

        function drawDrawingPreview() {
            if (!roiCtx) return;
            drawAllRois(document.querySelector('.roi-item.active')?.dataset.roiKey || null);
            if (!drawingVertices.length) return;
            const msiRef = getMsiRefSize();
            const sxFactor = roiCanvas.height / msiRef.w;
            const syFactor = roiCanvas.width  / msiRef.h;
            const pts = drawingVertices.map(([mx, my]) => [my * syFactor, roiCanvas.height - mx * sxFactor]);
            const cssW = roiCanvas.offsetWidth || roiCanvas.width;
            const pxPerCss = roiCanvas.width / Math.max(1, cssW);
            roiCtx.save();
            roiCtx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
            roiCtx.lineWidth = 1.5 * pxPerCss;
            roiCtx.setLineDash([4 * pxPerCss, 3 * pxPerCss]);
            roiCtx.beginPath();
            roiCtx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) roiCtx.lineTo(pts[i][0], pts[i][1]);
            roiCtx.stroke();
            roiCtx.setLineDash([]);
            roiCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            const r = 3 * pxPerCss;
            for (const [x, y] of pts) {
                roiCtx.beginPath();
                roiCtx.arc(x, y, r, 0, 2 * Math.PI);
                roiCtx.fill();
            }
            roiCtx.restore();
        }

        function toggleDrawingMode(on) {
            drawingMode = (on === undefined) ? !drawingMode : !!on;
            const btn = document.getElementById('roi-draw-toggle');
            if (drawingMode) {
                drawingVertices = [];
                roiCanvas.style.pointerEvents = 'auto';
                roiCanvas.style.cursor = 'crosshair';
                if (btn) { btn.textContent = '中止'; btn.classList.add('bg-red-100', 'text-red-700', 'border-red-300'); }
            } else {
                drawingVertices = [];
                roiCanvas.style.pointerEvents = 'none';
                roiCanvas.style.cursor = '';
                if (btn) { btn.textContent = '+ 新規'; btn.classList.remove('bg-red-100', 'text-red-700', 'border-red-300'); }
                const activeKey = document.querySelector('.roi-item.active')?.dataset.roiKey || null;
                drawAllRois(activeKey);
            }
        }

        function nextUserRoiNumber() {
            const items = (atlasData.roi && atlasData.roi.roi_items) || {};
            const names = (atlasData.roi && atlasData.roi.roi_names) || {};
            const re = /^User ROI (\d+)$/;
            let maxN = 0;
            for (const k of Object.keys(items)) {
                if (!k.startsWith(USER_ROI_PREFIX)) continue;
                const m = (names[k] || '').match(re);
                if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
            }
            return maxN + 1;
        }

        function finalizeDrawing() {
